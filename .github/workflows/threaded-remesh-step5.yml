name: TEKNIK Threaded Remesh Step 5 Playthrough

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threaded-remesh-step5:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install runtime and recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb ffmpeg unzip wget libgl1 libx11-6 libxcursor1 \
            libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project and committed playthrough
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit-after 3 \
            2>&1 | tee artifacts/threaded-remesh-step5-parse.log
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script' artifacts/threaded-remesh-step5-parse.log

      - name: Record physics-tick gameplay scenario
        run: |
          set -o pipefail
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > artifacts/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          ffmpeg -y -loglevel warning \
            -f x11grab -draw_mouse 0 -framerate 30 -video_size 1280x720 -i :99 \
            -c:v libx264 -preset ultrafast -crf 20 -pix_fmt yuv420p \
            artifacts/threaded-remesh-step5-playthrough.mp4 \
            > artifacts/threaded-remesh-step5-ffmpeg.log 2>&1 &
          FFMPEG_PID=$!
          sleep 1
          set +e
          timeout 240 /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/threaded_remesh_step5_playthrough_gate.gd \
            2>&1 | tee artifacts/threaded-remesh-step5-playthrough.log
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          kill -INT "$FFMPEG_PID" 2>/dev/null || true
          wait "$FFMPEG_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          test -s artifacts/threaded-remesh-step5-playthrough.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            artifacts/threaded-remesh-step5-playthrough.mp4 \
            | tee artifacts/threaded-remesh-step5-video-info.txt
          exit "$GODOT_STATUS"

      - name: Verify playthrough result
        if: success()
        run: |
          grep -Fq 'THREADED_REMESH_STEP_5_PLAYTHROUGH_PASS' artifacts/threaded-remesh-step5-playthrough.log
          grep -Fq 'PLAYTHROUGH_ACTIONS first_mine=true place=true second_mine=true' artifacts/threaded-remesh-step5-playthrough.log
          test -s artifacts/threaded-remesh-step5-final.png
          test -s artifacts/threaded-remesh-step5-frames.csv
          test -s artifacts/threaded-remesh-step5-summary.json

      - name: Upload playthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-threaded-remesh-step5
          path: artifacts/
          if-no-files-found: error
