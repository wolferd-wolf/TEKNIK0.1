name: Resolve post-merge Actions run

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact main push run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: e70e6d02afdbbe3a1c6a736a29a6fbfa2b5898a8
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&head_sha=${TARGET_SHA}&event=push&per_page=100")"
          echo "${response}" >/tmp/post-merge-runs.json
          echo "MATCH_COUNT=$(jq -r '.total_count' /tmp/post-merge-runs.json)"
          jq -r '.workflow_runs[] | ["POST_MERGE_RUN_ID=\(.id)","POST_MERGE_RUN_URL=\(.html_url)","POST_MERGE_RUN_NUMBER=\(.run_number)","POST_MERGE_RUN_EVENT=\(.event)","POST_MERGE_RUN_BRANCH=\(.head_branch)","POST_MERGE_RUN_SHA=\(.head_sha)","POST_MERGE_RUN_STATUS=\(.status)","POST_MERGE_RUN_CONCLUSION=\(.conclusion)","POST_MERGE_RUN_CREATED_AT=\(.created_at)","POST_MERGE_RUN_UPDATED_AT=\(.updated_at)"] | .[]' /tmp/post-merge-runs.json
          jq -e --arg sha "${TARGET_SHA}" '.workflow_runs | map(select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")) | length >= 1' /tmp/post-merge-runs.json >/dev/null
