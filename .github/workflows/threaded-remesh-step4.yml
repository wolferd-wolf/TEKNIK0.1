name: TEKNIK Threaded Remesh Step 4 Equivalence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threaded-remesh-step4:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Materialize equivalence gate
        run: |
          cat > tests/threaded_remesh_step4_equivalence_gate.gd <<'GDSCRIPT'
          extends SceneTree

          const CHUNK := preload("res://scripts/world/chunk.gd")
          const SYNC := preload("res://scripts/world/chunk_mesher.gd")
          const THREADED := preload("res://scripts/world/threaded_chunk_mesher.gd")
          const SCREENSHOT := "res://artifacts/threaded-remesh-step4-equivalence.png"
          const REPORT := "res://artifacts/threaded-remesh-step4-equivalence.json"
          const SIZE := 16
          const AIR := 0
          const STONE := 3
          const EMPTY_HASH := "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          const DIRS := [Vector3i.LEFT, Vector3i.RIGHT, Vector3i.DOWN, Vector3i.UP, Vector3i.FORWARD, Vector3i.BACK]

          var failures: Array[String] = []
          var reports: Array[Dictionary] = []
          var visual_sync: ArrayMesh
          var visual_threaded: ArrayMesh

          func _initialize() -> void:
            call_deferred("_run")

          func _fail(message: String) -> void:
            failures.append(message)
            push_error(message)

          func _run() -> void:
            _empty_case()
            _colors_case()
            _positive_boundary_case()
            _negative_corner_case()
            _dense_exposed_case()
            _dense_enclosed_case()
            _mixed_case()
            if failures.is_empty():
              await _capture_screenshot()
            _write_report()
            if failures.is_empty():
              print("THREADED_REMESH_STEP_4_EQUIVALENCE_GATE_PASS")
              print("EQUIVALENCE_CASES=%d" % reports.size())
              for item in reports:
                print("EQUIVALENCE_CASE name=%s faces=%d vertices=%d mesh_sha256=%s collision_sha256=%s" % [item.name, item.faces, item.vertices, item.mesh_sha256, item.collision_sha256])
              quit(0)
              return
            print("THREADED_REMESH_STEP_4_EQUIVALENCE_GATE_FAIL")
            for failure in failures:
              print("FAILURE=%s" % failure)
            quit(1)

          func _empty_case() -> void:
            var chunks := {}
            var center = _chunk(Vector3i.ZERO, AIR)
            chunks[Vector3i.ZERO] = center
            _verify("empty", Vector3i.ZERO, chunks, false)

          func _colors_case() -> void:
            var chunks := {}
            var center = _chunk(Vector3i.ZERO, AIR)
            center.set_block(Vector3i(2, 2, 2), 1)
            center.set_block(Vector3i(5, 3, 4), 2)
            center.set_block(Vector3i(8, 4, 6), 3)
            center.set_block(Vector3i(11, 5, 8), 4)
            chunks[Vector3i.ZERO] = center
            _verify("all_block_colors", Vector3i.ZERO, chunks, false)

          func _positive_boundary_case() -> void:
            var chunks := {}
            var coord := Vector3i(3, 1, 2)
            var center = _chunk(coord, AIR)
            var right = _chunk(coord + Vector3i.RIGHT, AIR)
            center.set_block(Vector3i(15, 7, 9), 3)
            right.set_block(Vector3i(0, 7, 9), 2)
            chunks[coord] = center
            chunks[right.chunk_coord] = right
            _verify("positive_x_boundary_pair", coord, chunks, false)

          func _negative_corner_case() -> void:
            var chunks := {}
            var coord := Vector3i(-4, -2, -3)
            var center = _chunk(coord, AIR)
            center.set_block(Vector3i.ZERO, 4)
            chunks[coord] = center
            var left = _chunk(coord + Vector3i.LEFT, AIR)
            var down = _chunk(coord + Vector3i.DOWN, AIR)
            var forward = _chunk(coord + Vector3i.FORWARD, AIR)
            left.set_block(Vector3i(15, 0, 0), 3)
            down.set_block(Vector3i(0, 15, 0), 2)
            forward.set_block(Vector3i(0, 0, 15), 1)
            chunks[left.chunk_coord] = left
            chunks[down.chunk_coord] = down
            chunks[forward.chunk_coord] = forward
            _verify("negative_corner_three_neighbors", coord, chunks, false)

          func _dense_exposed_case() -> void:
            var chunks := {}
            var coord := Vector3i(1, 0, -2)
            chunks[coord] = _chunk(coord, STONE)
            _verify("dense_exposed", coord, chunks, false)

          func _dense_enclosed_case() -> void:
            var chunks := {}
            var coord := Vector3i(-1, 2, 1)
            chunks[coord] = _chunk(coord, STONE)
            for direction in DIRS:
              chunks[coord + direction] = _chunk(coord + direction, STONE)
            _verify("dense_fully_enclosed", coord, chunks, false)

          func _mixed_case() -> void:
            var chunks := {}
            var coord := Vector3i(2, -1, 3)
            var center = _chunk(coord, AIR)
            for y in range(SIZE):
              for z in range(SIZE):
                for x in range(SIZE):
                  if posmod(x * 17 + y * 31 + z * 47, 19) < 5:
                    center.set_block(Vector3i(x, y, z), 1 + posmod(x + y + z, 4))
            chunks[coord] = center
            for direction_index in range(DIRS.size()):
              var direction: Vector3i = DIRS[direction_index]
              var neighbor = _chunk(coord + direction, AIR)
              for a in range(SIZE):
                for b in range(SIZE):
                  if posmod(a * 7 + b * 11 + direction_index * 5, 13) < 4:
                    neighbor.set_block(_boundary_coord(direction, a, b), 1 + posmod(a + b + direction_index, 4))
              chunks[neighbor.chunk_coord] = neighbor
            _verify("deterministic_mixed_neighbors", coord, chunks, true)

          func _verify(name: String, coord: Vector3i, chunks: Dictionary, retain: bool) -> void:
            var center = chunks[coord]
            var sync_mesh: ArrayMesh = SYNC.build_mesh(center, Callable(self, "_lookup").bind(chunks))
            var worker: Dictionary = THREADED._compute_mesh_data(_snapshot(coord, chunks))
            var threaded_mesh := _mesh(worker)
            if (sync_mesh == null) != (threaded_mesh == null):
              _fail("%s: null/empty behavior differs" % name)
              return

            var sync_arrays := _arrays(sync_mesh)
            var threaded_arrays := _arrays(threaded_mesh)
            var sync_vertices: PackedVector3Array = sync_arrays.vertices
            var threaded_vertices: PackedVector3Array = threaded_arrays.vertices
            var sync_normals: PackedVector3Array = sync_arrays.normals
            var threaded_normals: PackedVector3Array = threaded_arrays.normals
            var sync_colors: PackedColorArray = sync_arrays.colors
            var threaded_colors: PackedColorArray = threaded_arrays.colors
            var face_count: int = sync_vertices.size() / 6

            if face_count != int(worker.get("visible_face_count", -1)):
              _fail("%s: face count differs" % name)
            if sync_vertices != threaded_vertices:
              _fail("%s: ordered vertices differ" % name)
            if sync_normals != threaded_normals:
              _fail("%s: ordered normals differ" % name)
            if sync_colors != threaded_colors:
              _fail("%s: ordered colors differ" % name)
            var mesh_hash := _mesh_hash(sync_vertices, sync_normals, sync_colors)
            if mesh_hash != _mesh_hash(threaded_vertices, threaded_normals, threaded_colors):
              _fail("%s: mesh bytes differ" % name)

            var collision_hash := "empty"
            if sync_mesh != null:
              if sync_mesh.get_aabb() != threaded_mesh.get_aabb():
                _fail("%s: AABB differs" % name)
              var sync_collision: PackedVector3Array = (sync_mesh.create_trimesh_shape() as ConcavePolygonShape3D).get_faces()
              var threaded_collision: PackedVector3Array = (threaded_mesh.create_trimesh_shape() as ConcavePolygonShape3D).get_faces()
              if sync_collision != threaded_collision:
                _fail("%s: ordered collision faces differ" % name)
              collision_hash = _hash(sync_collision.to_byte_array())
              if collision_hash != _hash(threaded_collision.to_byte_array()):
                _fail("%s: collision bytes differ" % name)

            reports.append({"name": name, "faces": face_count, "vertices": sync_vertices.size(), "mesh_sha256": mesh_hash, "collision_sha256": collision_hash})
            if retain:
              visual_sync = sync_mesh
              visual_threaded = threaded_mesh

          func _chunk(coord: Vector3i, fill: int):
            var chunk = CHUNK.new()
            chunk.configure(coord)
            if fill != AIR:
              chunk.blocks.fill(fill)
            return chunk

          func _snapshot(coord: Vector3i, chunks: Dictionary) -> Dictionary:
            var neighbors := {}
            for direction in DIRS:
              var neighbor = chunks.get(coord + direction)
              neighbors[direction] = PackedByteArray() if neighbor == null else neighbor.blocks.duplicate()
            return {"chunk_coord": coord, "blocks": chunks[coord].blocks.duplicate(), "neighbors": neighbors}

          func _lookup(world: Vector3i, chunks: Dictionary) -> int:
            var coord := Vector3i(floori(world.x / float(SIZE)), floori(world.y / float(SIZE)), floori(world.z / float(SIZE)))
            var chunk = chunks.get(coord)
            if chunk == null:
              return AIR
            return chunk.get_block(Vector3i(posmod(world.x, SIZE), posmod(world.y, SIZE), posmod(world.z, SIZE)))

          func _boundary_coord(direction: Vector3i, a: int, b: int) -> Vector3i:
            if direction == Vector3i.LEFT: return Vector3i(15, a, b)
            if direction == Vector3i.RIGHT: return Vector3i(0, a, b)
            if direction == Vector3i.DOWN: return Vector3i(a, 15, b)
            if direction == Vector3i.UP: return Vector3i(a, 0, b)
            if direction == Vector3i.FORWARD: return Vector3i(a, b, 15)
            return Vector3i(a, b, 0)

          func _mesh(worker: Dictionary) -> ArrayMesh:
            var vertices: PackedVector3Array = worker.get("vertices", PackedVector3Array())
            if vertices.is_empty(): return null
            var arrays := []
            arrays.resize(Mesh.ARRAY_MAX)
            arrays[Mesh.ARRAY_VERTEX] = vertices
            arrays[Mesh.ARRAY_NORMAL] = worker.get("normals", PackedVector3Array())
            arrays[Mesh.ARRAY_COLOR] = worker.get("colors", PackedColorArray())
            var mesh := ArrayMesh.new()
            mesh.add_surface_from_arrays(Mesh.PRIMITIVE_TRIANGLES, arrays)
            return mesh

          func _arrays(mesh: ArrayMesh) -> Dictionary:
            if mesh == null:
              return {"vertices": PackedVector3Array(), "normals": PackedVector3Array(), "colors": PackedColorArray()}
            var arrays := mesh.surface_get_arrays(0)
            return {"vertices": arrays[Mesh.ARRAY_VERTEX], "normals": arrays[Mesh.ARRAY_NORMAL], "colors": arrays[Mesh.ARRAY_COLOR]}

          func _mesh_hash(vertices: PackedVector3Array, normals: PackedVector3Array, colors: PackedColorArray) -> String:
            var bytes := PackedByteArray()
            bytes.append_array(vertices.to_byte_array())
            bytes.append_array(normals.to_byte_array())
            bytes.append_array(colors.to_byte_array())
            return _hash(bytes)

          func _hash(bytes: PackedByteArray) -> String:
            if bytes.is_empty(): return EMPTY_HASH
            var context := HashingContext.new()
            context.start(HashingContext.HASH_SHA256)
            context.update(bytes)
            return context.finish().hex_encode()

          func _capture_screenshot() -> void:
            var scene := Node3D.new()
            root.add_child(scene)
            var light := DirectionalLight3D.new()
            light.rotation_degrees = Vector3(-48, -32, 0)
            scene.add_child(light)
            var camera := Camera3D.new()
            camera.current = true
            camera.position = Vector3(8, 18, 42)
            scene.add_child(camera)
            camera.look_at(Vector3(8, 7, 0), Vector3.UP)
            for data in [{"mesh": visual_sync, "x": -9.0}, {"mesh": visual_threaded, "x": 9.0}]:
              var instance := MeshInstance3D.new()
              instance.mesh = data.mesh
              instance.position.x = data.x
              instance.material_override = SYNC.create_material()
              scene.add_child(instance)
            var layer := CanvasLayer.new()
            scene.add_child(layer)
            var label := Label.new()
            label.text = "SYNCHRONOUS REFERENCE                    THREADED OUTPUT\nFinal mesh arrays and collision faces are byte-identical"
            label.position = Vector2(125, 24)
            label.add_theme_font_size_override("font_size", 22)
            layer.add_child(label)
            for _frame in range(8): await process_frame
            await RenderingServer.frame_post_draw
            var image := root.get_texture().get_image()
            if image == null or image.is_empty():
              _fail("Step 4 screenshot is empty")
              return
            var error := image.save_png(ProjectSettings.globalize_path(SCREENSHOT))
            if error != OK: _fail("Step 4 screenshot save failed: %d" % error)
            else: print("THREADED_REMESH_STEP_4_SCREENSHOT=%s" % ProjectSettings.globalize_path(SCREENSHOT))

          func _write_report() -> void:
            var file := FileAccess.open(ProjectSettings.globalize_path(REPORT), FileAccess.WRITE)
            if file == null:
              _fail("Could not write Step 4 report")
              return
            file.store_string(JSON.stringify({"pass": failures.is_empty(), "cases": reports, "failures": failures}, "  "))
          GDSCRIPT

      - name: Parse project and generated gate
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee artifacts/threaded-remesh-step4-parse.log

      - name: Verify synchronous and threaded output equivalence
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/threaded_remesh_step4_equivalence_gate.gd \
            2>&1 | tee artifacts/threaded-remesh-step4-equivalence.log

      - name: Upload equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-threaded-remesh-step4
          path: artifacts/
          if-no-files-found: error
