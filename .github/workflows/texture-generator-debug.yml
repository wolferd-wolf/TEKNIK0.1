name: TEKNIK Texture Generator Debug
on:
  push:
    branches:
      - feature/procedural-pixel-textures
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxrender1 libwayland-client0 libwayland-egl1 libfontconfig1 libfreetype6
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
      - name: Parse generator directly
        run: /tmp/godot/godot --headless --path . --check-only --script res://scripts/textures/texture_generator.gd