name: TEKNIK Acceptance Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  acceptance-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove retired world code is absent and unreferenced
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("scripts"), Path("scenes"), Path("tests"), Path(".github/workflows"), Path("project.godot")]
          retired = [
              "scripts/world/" + "biome" + "_probe.gd",
              "scripts/world/" + "chunk.gd",
              "scripts/world/" + "chunk" + "_manager.gd",
              "scripts/world/" + "chunk" + "_mesher.gd",
              "scripts/world/" + "threaded" + "_chunk_mesher.gd",
              "tests/" + "null_mesh" + "_remesh_gate.gd",
              "tests/" + "boundary_remesh" + "_spread_gate.gd",
              "tests/" + "dummy_mesh" + "_teardown_diagnostic.gd",
              "tests/" + "face_winding" + "_diagnostic.gd",
              "tests/" + "threaded_remesh" + "_step2_gate.gd",
              "tests/" + "threaded_remesh" + "_step3_concurrency_gate.gd",
              "tests/" + "threaded_remesh" + "_step5_playthrough_gate.gd",
          ]
          for item in retired:
              if Path(item).exists():
                  raise SystemExit(f"Retired path still exists: {item}")

          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(path for path in root.rglob("*") if path.is_file())
          stale = []
          for path in files:
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for item in retired:
                  if item in text or ("res://" + item) in text:
                      stale.append(f"{path}: {item}")
          if stale:
              raise SystemExit("Retired references remain:\n" + "\n".join(stale))
          print("RETIRED_WORLD_REFERENCE_SCAN_PASS")
          PY

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse consolidated project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-acceptance-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/headless-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/headless-parse.log; then
            exit 1
          fi

      - name: Measure multi-noise Step 1 generation baseline
        run: |
          set -o pipefail
          {
            echo "runner_image=${ImageOS:-unknown}"
            uname -a
            cat /etc/os-release
            lscpu
          } 2>&1 | tee artifacts/multi-noise-step1-environment.log
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-multi-noise-step1" \
            timeout 300 /tmp/godot/godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              --script res://tests/multi_noise_step1_gate.gd \
              2>&1 | tee artifacts/multi-noise-step1-benchmark.log
          grep -Fq 'MULTI_NOISE_STEP1_GATE_PASS' artifacts/multi-noise-step1-benchmark.log
          grep -Fq 'MULTI_NOISE_STEP1_BENCHMARK_JSON=' artifacts/multi-noise-step1-benchmark.log

      - name: Gate 60-block terrain and real chunk meshing
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-world-height-60" \
            timeout 300 /tmp/godot/godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              --script res://tests/world_height_60_gate.gd \
              2>&1 | tee artifacts/world-height-60.log
          grep -Fq 'WORLD_HEIGHT_60_GATE_PASS' artifacts/world-height-60.log
          grep -Fq 'WORLD_HEIGHT_60_GATE_JSON=' artifacts/world-height-60.log

      - name: Prove desktop and headless use the shipping world
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-acceptance-standalone" \
            timeout 300 /tmp/godot/godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              --script res://tests/playable_world_mining_port_gate.gd \
              2>&1 | tee artifacts/playable-world-standalone.log
          grep -Fq 'PLAYABLE_WORLD_STANDALONE_GATE_PASS' artifacts/playable-world-standalone.log

      - name: Launch and validate consolidated scene headlessly
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-acceptance-headless" \
            timeout 300 /tmp/godot/godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              --script res://tests/acceptance_gate.gd \
              -- --headless-only \
              2>&1 | tee artifacts/headless-runtime.log
          grep -Fq 'TEKNIK_ACCEPTANCE_GATE_PASS' artifacts/headless-runtime.log

      - name: Run graphical consolidated-world acceptance
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-acceptance-graphical" \
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
              --audio-driver Dummy \
              --path . \
              --script res://tests/acceptance_gate.gd \
              2>&1 | tee artifacts/acceptance-gate.log
          grep -Fq 'TEKNIK_ACCEPTANCE_GATE_PASS' artifacts/acceptance-gate.log

      - name: Validate mining targeting on playable world
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-mining-targeting" \
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
              --audio-driver Dummy --path . \
              --script res://tests/mining_targeting_gate.gd \
              2>&1 | tee artifacts/mining-targeting.log

      - name: Validate mining and 12-block boundary rebuilds
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-mining-step2" \
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
              --audio-driver Dummy --path . \
              --script res://tests/mining_step2_gate.gd \
              2>&1 | tee artifacts/mining-step2.log
          grep -Fq 'MINING_STEP_2_GATE_PASS' artifacts/mining-step2.log

      - name: Validate placement collision and rejection behavior
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-placement-step3" \
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
              --audio-driver Dummy --path . \
              --script res://tests/placement_step3_gate.gd \
              2>&1 | tee artifacts/placement-step3.log
          grep -Fq 'PLACEMENT_STEP_3_GATE_PASS' artifacts/placement-step3.log

      - name: Validate playable-world boundary and loaded-edge cases
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-edge-cases-step5" \
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
              --audio-driver Dummy --path . \
              --script res://tests/edge_cases_step5_gate.gd \
              2>&1 | tee artifacts/edge-cases.log
          grep -Fq 'EDGE_CASES_STEP_5_GATE_PASS' artifacts/edge-cases.log

      - name: Validate inventory model and playable-world transactions
        run: |
          set -o pipefail
          for gate in \
            inventory_step1_gate.gd \
            inventory_mining_step2_gate.gd \
            inventory_placement_step3_gate.gd \
            inventory_hotbar_step4_gate.gd \
            inventory_crafting_step5_gate.gd \
            inventory_vanilla_baseline_gate.gd
          do
            name="${gate%.gd}"
            XDG_DATA_HOME="$RUNNER_TEMP/teknik-${name}" \
              timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
                --audio-driver Dummy --path . \
                --script "res://tests/${gate}" \
                2>&1 | tee "artifacts/${name}.log"
          done

      - name: Validate touch controls against consolidated main scene
        run: |
          set -o pipefail
          for gate in touch_joystick_step1_gate.gd touch_drag_look_step2_gate.gd
          do
            name="${gate%.gd}"
            XDG_DATA_HOME="$RUNNER_TEMP/teknik-${name}" \
              timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
                --audio-driver Dummy --path . \
                --script "res://tests/${gate}" \
                2>&1 | tee "artifacts/${name}.log"
          done

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-consolidated-acceptance
          path: artifacts/
          if-no-files-found: error

      - name: Publish acceptance commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="failure"
          description="Consolidated acceptance gate failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="All single-world acceptance gates passed"
          fi
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"TEKNIK Acceptance Gate\",\"description\":\"${description}\"}"
