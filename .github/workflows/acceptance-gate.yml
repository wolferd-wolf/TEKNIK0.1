name: TEKNIK Acceptance Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee artifacts/headless-parse.log

      - name: Validate empty remesh runtime window headlessly
        run: |
          set -o pipefail
          timeout 300 /tmp/godot/godot \
            --headless \
            --audio-driver Dummy \
            --path . \
            --script res://tests/null_mesh_remesh_gate.gd \
            2>&1 | tee artifacts/null-mesh-remesh-gate.log
          awk '/NULL_MESH_REMESH_GATE_PASS/{exit} {print}' artifacts/null-mesh-remesh-gate.log > artifacts/null-mesh-remesh-runtime-window.log
          if grep -F 'Parameter "m" is null.' artifacts/null-mesh-remesh-runtime-window.log; then
            echo "Null mesh renderer error occurred during remesh cycles"
            exit 1
          fi

      - name: Validate boundary remesh spread headlessly
        run: |
          set -o pipefail
          timeout 300 /tmp/godot/godot \
            --headless \
            --audio-driver Dummy \
            --path . \
            --script res://tests/boundary_remesh_spread_gate.gd \
            2>&1 | tee artifacts/boundary-remesh-spread.log
          awk '/BOUNDARY_REMESH_SPREAD_GATE_PASS/{exit} {print}' artifacts/boundary-remesh-spread.log > artifacts/boundary-remesh-spread-runtime-window.log
          if grep -F 'Parameter "m" is null.' artifacts/boundary-remesh-spread-runtime-window.log; then
            echo "Null mesh renderer error occurred during boundary remesh spread"
            exit 1
          fi

      - name: Launch actual scene headlessly
        run: |
          set -o pipefail
          timeout 300 /tmp/godot/godot \
            --headless \
            --audio-driver Dummy \
            --path . \
            --script res://tests/acceptance_gate.gd \
            -- --headless-only \
            2>&1 | tee artifacts/headless-runtime.log

      - name: Run graphical gates and capture screenshot
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/acceptance_gate.gd \
            2>&1 | tee artifacts/acceptance-gate.log

      - name: Validate all voxel face windings visually
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/face_winding_diagnostic.gd \
            2>&1 | tee artifacts/face-winding-diagnostic.log

      - name: Validate mining targeting and capture screenshot
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/mining_targeting_gate.gd \
            2>&1 | tee artifacts/mining-targeting-step1.log

      - name: Validate mining removal, collision, and boundary remesh
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/mining_step2_gate.gd \
            2>&1 | tee artifacts/mining-step2.log

      - name: Validate placement, collision, and player overlap rejection
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/placement_step3_gate.gd \
            2>&1 | tee artifacts/placement-step3.log

      - name: Validate final mining and placement edge cases
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/edge_cases_step5_gate.gd \
            2>&1 | tee artifacts/edge-cases-step5.log

      - name: Validate inventory data structure and capture screenshot
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_step1_gate.gd \
            2>&1 | tee artifacts/inventory-step1.log

      - name: Validate inventory-backed mining and full-inventory fallback
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_mining_step2_gate.gd \
            2>&1 | tee artifacts/inventory-mining-step2.log

      - name: Validate inventory-backed placement and selected-empty-slot fallback
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_placement_step3_gate.gd \
            2>&1 | tee artifacts/inventory-placement-step3.log

      - name: Validate rendered hotbar contents and InputMap selection
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_hotbar_step4_gate.gd \
            2>&1 | tee artifacts/inventory-hotbar-step4.log

      - name: Validate inventory crafting action and atomic failure
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_crafting_step5_gate.gd \
            2>&1 | tee artifacts/inventory-crafting-step5.log

      - name: Validate virtual joystick simulated touch InputMap states
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/touch_joystick_step1_gate.gd \
            2>&1 | tee artifacts/touch-joystick-step1.log

      - name: Validate right-side drag-look simulated touch InputMap states
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/touch_drag_look_step2_gate.gd \
            2>&1 | tee artifacts/touch-drag-look-step2.log

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-acceptance-gate
          path: artifacts/
          if-no-files-found: error

      - name: Publish acceptance commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="failure"
          description="Acceptance gate failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="All acceptance gates passed"
          fi
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"TEKNIK Acceptance Gate\",\"description\":\"${description}\"}"
