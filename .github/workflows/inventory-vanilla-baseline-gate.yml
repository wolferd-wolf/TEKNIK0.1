name: TEKNIK Inventory on Vanilla Baseline

on:
  push:
    branches:
      - session/inventory-on-vanilla-lighting
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inventory-on-vanilla-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce inventory-only scope
        shell: bash
        run: |
          set -euo pipefail
          baseline=cf99111d98f6259deda4535bfe9770bcba9d18e9
          git cat-file -e "${baseline}^{commit}"

          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/inventory-vanilla-baseline-gate.yml
          project.godot
          scripts/inventory/block_inventory.gd
          scripts/player/inventory_first_person_controller.gd
          scripts/ui/minecraft_inventory_screen.gd
          tests/inventory_mining_step2_gate.gd
          tests/inventory_placement_step3_gate.gd
          tests/inventory_step1_gate.gd
          tests/inventory_vanilla_baseline_gate.gd
          EOF
          git diff --name-only "$baseline" HEAD | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          git diff --exit-code "$baseline" HEAD -- \
            scenes/main.tscn \
            scripts/player/first_person_controller.gd \
            scripts/player/mobile_camera_sensitivity.gd \
            scripts/ui/touch_controls.gd \
            scripts/ui/touch_action_controls.gd \
            scripts/world

          echo 'INVENTORY_ONLY_SCOPE_PASS'
          echo 'APPROVED_BASELINE=cf99111d98f6259deda4535bfe9770bcba9d18e9'

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse approved project plus inventory
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee artifacts/inventory-parse.log

      - name: Validate Minecraft inventory on approved gameplay baseline
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_vanilla_baseline_gate.gd \
            2>&1 | tee artifacts/inventory-vanilla-baseline.log
          grep -Fq 'INVENTORY_VANILLA_BASELINE_GATE_PASS' artifacts/inventory-vanilla-baseline.log
          grep -Fq 'APPROVED_CAMERA_SENSITIVITY=0.0035 radians per drag pixel' artifacts/inventory-vanilla-baseline.log
          grep -Fq 'APPROVED_DIRECTIONAL_SHADOW_MAPS=disabled' artifacts/inventory-vanilla-baseline.log

      - name: Validate 36-slot inventory acceptance compatibility
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_step1_gate.gd \
            2>&1 | tee artifacts/inventory-step1.log
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_mining_step2_gate.gd \
            2>&1 | tee artifacts/inventory-mining-step2.log
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/inventory_placement_step3_gate.gd \
            2>&1 | tee artifacts/inventory-placement-step3.log

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-inventory-on-vanilla-baseline
          path: artifacts/
          if-no-files-found: error

      - name: Publish inventory baseline status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Inventory-on-vanilla gate failed'
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Inventory added; approved gameplay baseline preserved'
          fi
          curl --fail-with-body \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"TEKNIK Inventory Vanilla Baseline\",\"description\":\"${description}\"}"
