name: TEKNIK Inventory on Consolidated World

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/inventory/**'
      - 'scripts/ui/inventory_hotbar.gd'
      - 'scripts/ui/minecraft_inventory_screen.gd'
      - 'scripts/player/inventory_first_person_controller.gd'
      - 'scripts/world/playable_world_port.gd'
      - 'tests/inventory_vanilla_baseline_gate.gd'
      - 'tests/playable_world_mining_port_gate.gd'
      - '.github/workflows/inventory-vanilla-baseline-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inventory-on-consolidated-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse inventory plus shipping world strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-inventory-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/inventory-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/inventory-parse.log; then
            exit 1
          fi

      - name: Prove inventory scene uses the shipping world
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-inventory-world-binding" \
            timeout 300 /tmp/godot/godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              --script res://tests/playable_world_mining_port_gate.gd \
              2>&1 | tee artifacts/inventory-world-binding.log
          grep -Fq 'PLAYABLE_WORLD_STANDALONE_GATE_PASS' artifacts/inventory-world-binding.log

      - name: Validate approved inventory camera and lighting behavior
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-inventory-vanilla-baseline" \
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
              --audio-driver Dummy \
              --path . \
              --script res://tests/inventory_vanilla_baseline_gate.gd \
              2>&1 | tee artifacts/inventory-vanilla-baseline.log
          grep -Fq 'INVENTORY_VANILLA_BASELINE_GATE_PASS' artifacts/inventory-vanilla-baseline.log
          grep -Fq 'APPROVED_CAMERA_SENSITIVITY=0.0035 radians per drag pixel' artifacts/inventory-vanilla-baseline.log
          grep -Fq 'APPROVED_DIRECTIONAL_SHADOW_MAPS=disabled' artifacts/inventory-vanilla-baseline.log

      - name: Validate complete inventory transaction suite
        run: |
          set -o pipefail
          for gate in \
            inventory_step1_gate.gd \
            inventory_mining_step2_gate.gd \
            inventory_placement_step3_gate.gd \
            inventory_hotbar_step4_gate.gd \
            inventory_crafting_step5_gate.gd
          do
            name="${gate%.gd}"
            XDG_DATA_HOME="$RUNNER_TEMP/teknik-${name}" \
              timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
                --audio-driver Dummy --path . \
                --script "res://tests/${gate}" \
                2>&1 | tee "artifacts/${name}.log"
          done

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-inventory-on-consolidated-world
          path: artifacts/
          if-no-files-found: error

      - name: Publish inventory status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Inventory consolidated-world gate failed'
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Inventory transactions passed on shipping world'
          fi
          curl --fail-with-body \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"TEKNIK Inventory Consolidated World\",\"description\":\"${description}\"}"
