name: TEKNIK Merge Main Into Touch Export Branch

on:
  push:
    branches: [session/touch-controls-android-export]

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: session/touch-controls-android-export
          fetch-depth: 0

      - name: Merge current main with exact conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main session/touch-controls-android-export

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts detected:\n'
            printf '  %s\n' "${conflicts[@]}"
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != "TEKNIK_BUILD_PLAN.md" ]]; then
              echo 'Unexpected conflict set; refusing to guess.' >&2
              git status --short
              exit 1
            fi

            git show :2:TEKNIK_BUILD_PLAN.md > /tmp/build-plan-touch.md
            git show :3:TEKNIK_BUILD_PLAN.md > /tmp/build-plan-main.md
            python3 - <<'PY'
          from pathlib import Path

          touch = Path('/tmp/build-plan-touch.md').read_text()
          main = Path('/tmp/build-plan-main.md').read_text()
          touch_marker = '## Session: Touch Controls and Android Export'
          threaded_marker = '## Session: Threaded Remeshing'

          if touch_marker not in touch:
              raise SystemExit('Touch session marker missing from feature side')
          if threaded_marker not in main:
              raise SystemExit('Threaded session marker missing from main side')

          touch_prefix, touch_section = touch.split(touch_marker, 1)
          main_prefix, threaded_section = main.split(threaded_marker, 1)
          if touch_prefix.rstrip() != main_prefix.rstrip():
              raise SystemExit('Unexpected pre-session content divergence; refusing to guess')

          merged = (
              touch_prefix.rstrip()
              + '\n\n'
              + touch_marker
              + touch_section.rstrip()
              + '\n\n'
              + threaded_marker
              + threaded_section.rstrip()
              + '\n'
          )
          Path('TEKNIK_BUILD_PLAN.md').write_text(merged)
          PY
            git add TEKNIK_BUILD_PLAN.md
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain.' >&2
            git status --short
            exit 1
          fi

          git rm .github/workflows/merge-touch-main-helper.yml
          git status --short
          git commit -m "Merge main into session/touch-controls-android-export"
          git push origin HEAD:session/touch-controls-android-export
