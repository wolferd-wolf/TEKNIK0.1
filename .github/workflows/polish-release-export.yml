name: TEKNIK Polish Release Export

on:
  push:
    branches:
      - session/polish-world-fixes
    paths:
      - export_presets.cfg
      - scripts/android/setup_release_keystore.sh
      - .github/workflows/polish-release-export.yml
  pull_request:
    branches:
      - main
    paths:
      - export_presets.cfg
      - scripts/android/setup_release_keystore.sh
      - .github/workflows/polish-release-export.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export-release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: teknikrelease
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: teknikrelease
      DEBUG_APK_SIZE_BYTES: '69239674'

    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record source revision
        run: |
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-commit.txt
          git status --short | tee artifacts/source-status.txt

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and verify self-signed release keystore
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="${RUNNER_TEMP}/teknik-test-release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${GODOT_ANDROID_KEYSTORE_RELEASE_PATH}" >> "$GITHUB_ENV"
          bash scripts/android/setup_release_keystore.sh "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            2>&1 | tee artifacts/release-keystore.log
          test -s "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          grep -Fq 'Alias name: teknikrelease' artifacts/release-keystore.log
          grep -Fq 'Owner: CN=TEKNIK Test Release, O=TEKNIK, C=IN' artifacts/release-keystore.log

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK requirements
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3 and matching export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpack
          cp -a /tmp/godot-template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

          /tmp/godot/godot --version | tee artifacts/godot-version.txt
          java -version 2>&1 | tee artifacts/java-version.txt

      - name: Export one signed release APK
        id: export
        shell: bash
        run: |
          set +e
          set -o pipefail
          output_path="$GITHUB_WORKSPACE/artifacts/TEKNIK-0.1-release.apk"
          command=(
            /tmp/godot/godot
            --headless
            --verbose
            --path "$GITHUB_WORKSPACE"
            --install-android-build-template
            --export-release "Android Release"
            "$output_path"
          )

          {
            printf 'Exact command:'
            printf ' %q' "${command[@]}"
            printf '\nPreset: Android Release\nMode: --export-release\nOutput path: %s\n' "$output_path"
          } | tee artifacts/export-command.txt

          "${command[@]}" 2>&1 | tee artifacts/godot-android-release-export.log
          export_status=${PIPESTATUS[0]}
          printf '%s\n' "$export_status" | tee artifacts/godot-android-release-export.exit-code
          echo "status=$export_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect and gate signed release APK
        if: steps.export.outputs.status == '0'
        run: |
          apk="$GITHUB_WORKSPACE/artifacts/TEKNIK-0.1-release.apk"
          test -s "$apk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$apk" 2>&1 | tee artifacts/apksigner-verification.txt

          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" \
            > artifacts/AndroidManifest.xml
          if grep -Eq 'android:debuggable="true"|android:debuggable="1"' artifacts/AndroidManifest.xml; then
            echo 'Release gate rejected: manifest is debuggable.' >&2
            exit 1
          fi
          if grep -Fq 'CN=Android Debug' artifacts/apksigner-verification.txt; then
            echo 'Release gate rejected: APK uses the Android debug certificate.' >&2
            exit 1
          fi
          grep -Fq 'CN=TEKNIK Test Release' artifacts/apksigner-verification.txt

          python3 - <<'PY' | tee artifacts/apk-size-comparison.txt
          import os

          apk = 'artifacts/TEKNIK-0.1-release.apk'
          debug_bytes = int(os.environ['DEBUG_APK_SIZE_BYTES'])
          release_bytes = os.path.getsize(apk)
          delta = release_bytes - debug_bytes
          percent = (delta / debug_bytes) * 100

          print(f'debug_size_bytes={debug_bytes}')
          print(f'debug_size_decimal_mb={debug_bytes / 1_000_000:.6f}')
          print(f'debug_size_mib={debug_bytes / 1_048_576:.6f}')
          print(f'release_size_bytes={release_bytes}')
          print(f'release_size_decimal_mb={release_bytes / 1_000_000:.6f}')
          print(f'release_size_mib={release_bytes / 1_048_576:.6f}')
          print(f'delta_bytes={delta}')
          print(f'delta_decimal_mb={delta / 1_000_000:.6f}')
          print(f'delta_mib={delta / 1_048_576:.6f}')
          print(f'delta_percent={percent:.6f}')
          PY

          {
            stat --printf='size_bytes=%s\n' "$apk"
            sha256sum "$apk"
            echo 'Native library entries:'
            unzip -Z1 "$apk" | grep '^lib/' || true
          } | tee artifacts/apk-metadata.txt

      - name: Upload release APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-polish-release-apk
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

      - name: Preserve release export result
        if: always()
        run: |
          status_file="artifacts/godot-android-release-export.exit-code"
          if [[ ! -f "$status_file" ]]; then
            echo 'The release export command was never reached.' >&2
            exit 1
          fi
          status="$(cat "$status_file")"
          if [[ "$status" != '0' ]]; then
            echo "The release export failed with exit code $status." >&2
            exit "$status"
          fi
          test -s artifacts/TEKNIK-0.1-release.apk

      - name: Publish release export commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          description="Release export job ${JOB_STATUS}; run ${GITHUB_RUN_ID}"
          payload=$(python3 - "$state" "$target_url" "$description" <<'PY'
          import json
          import sys
          print(json.dumps({
              'state': sys.argv[1],
              'target_url': sys.argv[2],
              'description': sys.argv[3],
              'context': 'TEKNIK Polish Release Export',
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
