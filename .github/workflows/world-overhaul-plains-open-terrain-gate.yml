name: TEKNIK Plains Open Terrain Gate

on:
  pull_request:
    paths:
      - 'scripts/world/playable_world_stage7_biome_data.gd'
      - 'scripts/world/playable_world_stage8_biome_data.gd'
      - 'scripts/world/playable_world_generation_data.gd'
      - 'scripts/world/playable_world_generation_runtime.gd'
      - 'tests/world_overhaul_plains_open_terrain_gate.gd'
      - '.github/workflows/world-overhaul-plains-open-terrain-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plains-open-terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-plains-open-parse" timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee artifacts/plains-open-terrain-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/plains-open-terrain-parse.log; then exit 1; fi

      - name: Gate distribution and performance
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-plains-open" timeout 600 /tmp/godot/godot --headless --audio-driver Dummy --path . --script res://tests/world_overhaul_plains_open_terrain_gate.gd 2>&1 | tee artifacts/plains-open-terrain-gate.log
          grep -Fq 'PLAINS_OPEN_TERRAIN_GATE_PASS' artifacts/plains-open-terrain-gate.log
          grep -Fq 'PLAINS_OPEN_TERRAIN_GATE_JSON=' artifacts/plains-open-terrain-gate.log

      - name: Record exact source revision
        run: git rev-parse HEAD | tee artifacts/source-commit.txt

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plains-open-terrain-gate
          path: artifacts/
          if-no-files-found: error
