name: TEKNIK Android Runtime Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: |
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-commit.txt

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget

      - name: Enable KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          stat -c 'mode=%a owner=%U group=%G device=%n' /dev/kvm \
            | tee artifacts/kvm-access.txt

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3 and matching export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpack
          cp -a /tmp/godot-template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          /tmp/godot/godot --version | tee artifacts/godot-version.txt

      - name: Generate debug keystore
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${RUNNER_TEMP}/teknik-debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}" >> "$GITHUB_ENV"
          bash scripts/android/setup_debug_keystore.sh "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            2>&1 | tee artifacts/debug-keystore.log

      - name: Export installable arm64 phone APK
        run: |
          set -o pipefail
          grep '^architectures/' export_presets.cfg | tee artifacts/phone-architectures.txt
          /tmp/godot/godot \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --install-android-build-template \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/artifacts/TEKNIK-0.1-fixed-arm64-debug.apk" \
            2>&1 | tee artifacts/android-phone-export.log
          apk="artifacts/TEKNIK-0.1-fixed-arm64-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" \
            2>&1 | tee artifacts/phone-apk-signature.txt
          unzip -Z1 "$apk" | grep '^lib/arm64-v8a/' \
            | tee artifacts/phone-apk-arm64-libraries.txt
          stat --printf='size_bytes=%s\n' "$apk" | tee artifacts/phone-apk-size.txt
          sha256sum "$apk" | tee artifacts/phone-apk-sha256.txt

      - name: Configure x86_64 emulator-only export
        run: |
          sed -i 's/architectures\/arm64-v8a=true/architectures\/arm64-v8a=false/' export_presets.cfg
          sed -i 's/architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          grep '^architectures/' export_presets.cfg | tee artifacts/emulator-architectures.txt

      - name: Export emulator debug APK
        run: |
          set -o pipefail
          /tmp/godot/godot \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/artifacts/TEKNIK-0.1-emulator-debug.apk" \
            2>&1 | tee artifacts/android-emulator-export.log
          test -s artifacts/TEKNIK-0.1-emulator-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            artifacts/TEKNIK-0.1-emulator-debug.apk \
            2>&1 | tee artifacts/emulator-apk-signature.txt

      - name: Boot Android emulator and verify app remains alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            package="com.wolferdwolf.teknik"
            evidence_dir="$GITHUB_WORKSPACE/artifacts"
            apk="$evidence_dir/TEKNIK-0.1-emulator-debug.apk"
            mkdir -p "$evidence_dir"
            {
              printf 'cwd=%s\n' "$(pwd)"
              printf 'workspace=%s\n' "$GITHUB_WORKSPACE"
              printf 'apk=%s\n' "$apk"
              test -s "$apk"
              adb devices -l
            } > "$evidence_dir/android-script-start.txt" 2>&1
            cat "$evidence_dir/android-script-start.txt"
            capture_android_evidence() {
              mkdir -p "$evidence_dir"
              adb logcat -d -v threadtime > "$evidence_dir/android-logcat.txt" 2>&1 || true
              adb shell dumpsys meminfo "$package" > "$evidence_dir/android-meminfo.txt" 2>&1 || true
              adb shell dumpsys activity activities > "$evidence_dir/android-activities.txt" 2>&1 || true
            }
            trap capture_android_evidence EXIT
            adb install -r "$apk" > "$evidence_dir/adb-install.txt" 2>&1
            cat "$evidence_dir/adb-install.txt"
            adb logcat -c
            adb shell am force-stop "$package"
            adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1 \
              > "$evidence_dir/adb-launch.txt" 2>&1
            cat "$evidence_dir/adb-launch.txt"
            sleep 8
            first_pid="$(adb shell pidof "$package" | tr -d '\r')"
            printf 'first_pid=%s\n' "$first_pid" | tee "$evidence_dir/android-runtime-pids.txt"
            test -n "$first_pid"
            sleep 22
            second_pid="$(adb shell pidof "$package" | tr -d '\r')"
            printf 'second_pid=%s\n' "$second_pid" | tee -a "$evidence_dir/android-runtime-pids.txt"
            test -n "$second_pid"
            test "$first_pid" = "$second_pid"
            capture_android_evidence
            if grep -E 'FATAL EXCEPTION|Fatal signal [0-9]+|Process: com\.wolferdwolf\.teknik.*has died' "$evidence_dir/android-logcat.txt"; then
              echo 'Android runtime emitted a fatal crash signature.' >&2
              exit 1
            fi
            echo 'ANDROID_RUNTIME_SMOKE_PASS' | tee "$evidence_dir/android-runtime-result.txt"

      - name: Upload verified Android builds and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-android-verified-builds
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
