name: Append touch Step 2 evidence

on:
  pull_request:
    branches:
      - session/touch-controls-android-export

permissions:
  contents: write

jobs:
  append-evidence:
    if: github.head_ref == 'validation/touch-drag-look-step2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/touch-drag-look-step2
          fetch-depth: 0

      - name: Append accepted Step 2 evidence
        run: |
          set -euo pipefail
          cat >> TEKNIK_BUILD_PLAN.md <<'EOF'
          - Step 2 drag-look source: A separately tracked touch that begins in the right half of the viewport and above the bottom 120-pixel reserved strip converts each drag relative vector into analog strengths on the existing `look_left`, `look_right`, `look_up`, and `look_down` InputMap actions. The unchanged player controller consumes those actions through its existing `Input.get_vector()` path, existing action look speed, and existing ±89-degree pitch clamp. The bottom strip remains reserved for Step 3 touch buttons and tappable hotbar slots.
          - Step 2 input ownership: Movement and look retain independent touch indices and release only their own InputMap actions. The accepted gate proves both directions of isolation: a left joystick drag leaves all look actions, the look vector, yaw, and pitch unchanged; a right look drag leaves all four movement actions unchanged. Look actions are short pulses for the drag event while look-touch ownership remains until touch-up.
          - Step 2 touch/mouse isolation: Godot's default touch-to-mouse emulation caused a real duplicate-input defect during validation: a left joystick screen drag also generated mouse motion and entered the existing desktop mouse-look path. Set `input_devices/pointing/emulate_mouse_from_touch=false` so touch is handled only by the explicit InputMap source. A device-0 mouse-motion regression still rotates yaw and pitch through the unchanged desktop mouse path, so keyboard/mouse testing remains supported.
          - Step 2 validation friction: Helper run `30834429791` failed before changing the gate because YAML indentation stripped its insertion anchor, and run `30834588921` reached the correct workflow patch but the bot token lacked permission to modify workflow files; the authenticated repository connector applied that CI-only change. Run `30834701738` was rejected because the new gate asserted before queued screen events were dispatched. Run `30835234042` then exposed the real touch-to-mouse bleed. Runs `30835728675` and `30836210834` confirmed that production isolation, physical mouse-look, and both clamps worked, but rejected test-only observation ordering and reverse-baseline assertions respectively. No rejected run was accepted as Step 2 evidence.
          - Step 2 gate: Actions run `30836677278` passed the complete inherited suite, the Step 1 joystick regression, and simulated right-side drag-look through `InputEventScreenTouch` and `InputEventScreenDrag` injected by `Input.parse_input_event`. An up-right drag produced actual InputMap strengths `look_right=0.707` and `look_up=0.707`, rotating yaw `0.00000 -> -0.10371` and pitch `0.00000 -> 0.10371`. Repeated touch drags reached and did not exceed the existing +89-degree (`1.55334` rad) and -89-degree (`-1.55334` rad) clamps. Physical mouse motion remained functional, moving yaw `-0.02661 -> -0.12661` and pitch `0.02661 -> 0.08661`. The reviewed 1280x720 screenshot shows the active right-side hint at `[P: (1036, 24), S: (220, 54)]`, the left joystick, and the nine-slot hotbar without clipping or graphical crash. Artifact `8865206065` has digest `sha256:f4bcfbad11981c85bf407b71c0c9aa6681ddf9817174894293c54c53f667ad8f`.
          - Step 2 device scope: Drag-look and its cross-boundary behavior are verified through desktop touch simulation only. No APK or real Android device was involved; real-device verification remains required after the Android export steps.
          EOF
          git rm .github/workflows/append-touch-step2-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEKNIK_BUILD_PLAN.md
          git commit -m "[TEKNIK] validation: record touch drag-look gate evidence"
          git push origin HEAD:validation/touch-drag-look-step2
