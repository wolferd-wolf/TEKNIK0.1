name: TEKNIK Mobile Startup Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-startup-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/mobile-headless-parse.log

      - name: Validate forced-mobile startup profile
        run: |
          set -o pipefail
          timeout 300 /tmp/godot/godot \
            --headless \
            --audio-driver Dummy \
            --path . \
            --script res://tests/mobile_startup_gate.gd \
            2>&1 | tee artifacts/mobile-startup-gate.log
          grep -Fq 'MOBILE_STARTUP_GATE_PASS' artifacts/mobile-startup-gate.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Parameter "m" is null\.|Segmentation fault' artifacts/mobile-startup-gate.log; then
            echo 'Mobile startup gate emitted a fatal runtime signature.' >&2
            exit 1
          fi

      - name: Upload mobile startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-mobile-startup-gate
          path: artifacts/
          if-no-files-found: error
