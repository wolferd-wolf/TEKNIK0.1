name: TEKNIK Texture Generator Gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  texture-generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxrender1 libwayland-client0 libwayland-egl1 libfontconfig1 libfreetype6
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version
      - name: Parse project strictly
        run: |
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee texture-generator-parse.log
          ! grep -E 'SCRIPT ERROR:|Parse Error|Failed to load script' texture-generator-parse.log
      - name: Run deterministic texture gate
        run: |
          set +e
          timeout 120 /tmp/godot/godot --headless --path . --script res://tests/texture_generator_gate.gd 2>&1 | tee texture-generator-gate.log
          godot_status=${PIPESTATUS[0]}
          set -e
          grep -F 'TEXTURE_GENERATOR_GATE_PASS' texture-generator-gate.log
          grep -F 'DETERMINISM_PASS' texture-generator-gate.log
          grep -F 'SEED_VARIATION_PASS' texture-generator-gate.log
          grep -F 'ORE_VEIN_PIXELS=' texture-generator-gate.log
          grep -F 'ORE_LARGEST_CLUSTER=' texture-generator-gate.log
          test "$godot_status" -eq 0
      - name: Render 3D block texture preview
        run: |
          set +e
          timeout 120 /tmp/godot/godot --headless --path . --script res://tests/texture_block_preview_gate.gd 2>&1 | tee texture-block-preview.log
          godot_status=${PIPESTATUS[0]}
          set -e
          grep -F 'TEXTURE_BLOCK_PREVIEW_PASS' texture-block-preview.log
          test "$godot_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texture-generator-preview
          path: |
            artifacts/texture_generator_preview.png
            artifacts/texture_block_preview_3d.png
            texture-generator-gate.log
            texture-generator-parse.log
            texture-block-preview.log
