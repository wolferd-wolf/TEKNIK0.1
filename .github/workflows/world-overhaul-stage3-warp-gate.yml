name: TEKNIK World Overhaul Stage 3 Warp Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/world/playable_world_stage3_generation_data.gd"
      - "scripts/world/playable_world_stage3_generation_runtime.gd"
      - "scripts/world/playable_world_stage3_cache.gd"
      - "scripts/world/playable_world_stage3_cache_fast.gd"
      - "scripts/world/playable_world_stage2_generation_data.gd"
      - "scripts/world/playable_world_stage2_generation_runtime.gd"
      - "scripts/world/playable_world_generation_data.gd"
      - "scripts/world/playable_world_generation_runtime.gd"
      - "tests/world_overhaul_stage3_warp_gate.gd"
      - ".github/workflows/world-overhaul-stage3-warp-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3-warp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage3-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/world-overhaul-stage3-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/world-overhaul-stage3-parse.log; then
            exit 1
          fi

      - name: Verify macro warp, lattice equivalence, seams and performance
        run: |
          set -o pipefail
          cp tests/world_overhaul_stage3_warp_gate.gd tests/_ci_world_overhaul_stage3_warp_gate.gd
          sed -i \
            -e 's#playable_world_generation_data.gd#playable_world_stage3_generation_data.gd#g' \
            -e 's#playable_world_generation_runtime.gd#playable_world_stage3_generation_runtime.gd#g' \
            tests/_ci_world_overhaul_stage3_warp_gate.gd
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage3-warp" \
            timeout 300 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/_ci_world_overhaul_stage3_warp_gate.gd \
              2>&1 | tee artifacts/world-overhaul-stage3-warp.log
          grep -Fq 'WORLD_OVERHAUL_STAGE3_PASS' artifacts/world-overhaul-stage3-warp.log

      - name: Upload Stage 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-overhaul-stage3-warp-evidence
          path: artifacts/
          if-no-files-found: error
