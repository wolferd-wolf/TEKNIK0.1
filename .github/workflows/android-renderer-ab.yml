name: TEKNIK Android Renderer A-B

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/android-renderer-ab.yml
      - android/**
      - native/carpathian/**
      - export_presets.cfg
      - project.godot
      - scenes/**
      - scripts/**

permissions:
  contents: read

jobs:
  export-renderer-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record source revision
        run: |
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-commit.txt
          git status --short --untracked-files=no | tee artifacts/source-status.txt
          test ! -s artifacts/source-status.txt

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential scons git unzip wget

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate one shared debug keystore
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${RUNNER_TEMP}/teknik-renderer-ab.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}" >> "$GITHUB_ENV"
          bash scripts/android/setup_debug_keystore.sh "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" > artifacts/debug-keystore.log 2>&1
          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

      - name: Install Android toolchain
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK requirements
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Build arm64 native extension once
        run: |
          git clone --depth 1 --branch 4.3 https://github.com/godotengine/godot-cpp.git native/carpathian/godot-cpp
          printf '%s\n' '{"enabled_classes":["RefCounted","OS"]}' > native/carpathian/build_profile.json
          cat > native/carpathian/SConstruct <<'PY'
          #!/usr/bin/env python
          env = SConscript("godot-cpp/SConstruct")
          env.Append(CPPPATH=["src/"])
          sources = Glob("src/*.cpp")
          library = env.SharedLibrary(
              "bin/libteknik_carpathian{}{}".format(env["suffix"], env["SHLIBSUFFIX"]),
              source=sources,
          )
          env.NoCache(library)
          Default(library)
          PY
          scons -C native/carpathian \
            platform=android \
            target=template_debug \
            arch=arm64 \
            android_api_level=24 \
            ndk_version=23.2.8568313 \
            build_profile=build_profile.json \
            ANDROID_HOME="$ANDROID_HOME" \
            -j2
          LIB_PATH="$(find native/carpathian/bin -maxdepth 1 -type f -name '*.so' | head -n 1)"
          test -n "$LIB_PATH"
          LIB_NAME="$(basename "$LIB_PATH")"
          cat > native/carpathian/teknik_carpathian.gdextension <<EOF
          [configuration]
          entry_symbol = "teknik_carpathian_library_init"
          compatibility_minimum = "4.3"

          [libraries]
          android.debug.arm64 = "res://native/carpathian/bin/$LIB_NAME"
          EOF
          rm -rf native/carpathian/godot-cpp

      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpack
          cp -a /tmp/godot-template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          /tmp/godot/godot --version | tee artifacts/godot-version.txt

      - name: Give the A-B pair an isolated package id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('export_presets.cfg')
          text = path.read_text()
          original = 'package/unique_name="com.wolferdwolf.teknik"'
          replacement = 'package/unique_name="com.wolferdwolf.teknik.rendererab"'
          if original not in text:
              raise SystemExit('expected Android package id was not found')
          text = text.replace(original, replacement)
          text = text.replace('package/name="TEKNIK 0.1"', 'package/name="TEKNIK Renderer A-B"')
          path.write_text(text)
          PY
          grep -Fq 'package/unique_name="com.wolferdwolf.teknik.rendererab"' export_presets.cfg
          printf '%s\n' 'A-B package: com.wolferdwolf.teknik.rendererab' > artifacts/renderer-ab-package.txt

      - name: Export Compatibility OpenGL build
        run: |
          grep -Fq 'renderer/rendering_method="gl_compatibility"' project.godot
          grep -Fq 'renderer/rendering_method.mobile="gl_compatibility"' project.godot
          cp project.godot artifacts/project-opengl.godot
          /tmp/godot/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --install-android-build-template \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/artifacts/TEKNIK-OpenGL.apk" \
            2>&1 | tee artifacts/export-opengl.log
          test -s artifacts/TEKNIK-OpenGL.apk

      - name: Switch only renderer settings to Mobile Vulkan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('project.godot')
          text = path.read_text()
          before = text
          text = text.replace('renderer/rendering_method="gl_compatibility"', 'renderer/rendering_method="mobile"')
          text = text.replace('renderer/rendering_method.mobile="gl_compatibility"', 'renderer/rendering_method.mobile="mobile"')
          if text == before:
              raise SystemExit('renderer replacement made no change')
          path.write_text(text)
          PY
          grep -Fq 'renderer/rendering_method="mobile"' project.godot
          grep -Fq 'renderer/rendering_method.mobile="mobile"' project.godot
          cp project.godot artifacts/project-vulkan.godot
          printf '%s\n' 'OpenGL artifact: Compatibility renderer / OpenGL ES' 'Vulkan artifact: Mobile renderer / Vulkan' > artifacts/renderer-pair.txt

      - name: Export Mobile Vulkan build
        run: |
          /tmp/godot/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/artifacts/TEKNIK-Vulkan.apk" \
            2>&1 | tee artifacts/export-vulkan.log
          test -s artifacts/TEKNIK-Vulkan.apk

      - name: Verify both APKs
        run: |
          for apk in artifacts/TEKNIK-OpenGL.apk artifacts/TEKNIK-Vulkan.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | sed -n '1,8p'
            unzip -Z1 "$apk" | grep -F 'libteknik_carpathian' >/dev/null
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.wolferdwolf.teknik.rendererab'"
            sha256sum "$apk"
          done | tee artifacts/apk-verification.txt

      - name: Upload renderer A-B pair
        uses: actions/upload-artifact@v4
        with:
          name: teknik-android-renderer-ab
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
