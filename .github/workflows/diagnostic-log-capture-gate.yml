name: TEKNIK Diagnostic Log Capture Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-log-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Parse strict
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-diagnostic-log-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/diagnostic-log-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/diagnostic-log-parse.log; then
            exit 1
          fi

      - name: Gate runtime capture persistence and worker markers
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-diagnostic-log-gate" \
            timeout 180 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/diagnostic_log_capture_gate.gd \
              2>&1 | tee artifacts/diagnostic-log-gate.log
          grep -Fq 'DIAGNOSTIC_LOG_CAPTURE_GATE_PASS' artifacts/diagnostic-log-gate.log

      - name: Upload diagnostic-log evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-log-capture-evidence
          path: artifacts/
          if-no-files-found: error
