name: TEKNIK Water Streaming Fix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/water-hitch-isolation.yml
      - scripts/world/localized_water_bodies.gd
      - scripts/world/localized_water_mesh_builder.gd
      - scripts/world/playable_world_carpathian_data.gd
      - tests/water_mesher_gate.gd
      - export_presets.cfg
      - project.godot

permissions:
  contents: read

jobs:
  water-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential scons git unzip wget

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate debug keystore
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${RUNNER_TEMP}/teknik-water-fix.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}" >> "$GITHUB_ENV"
          bash scripts/android/setup_debug_keystore.sh "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

      - name: Install Android toolchain
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK requirements
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Build arm64 native extension
        run: |
          git clone --depth 1 --branch 4.3 https://github.com/godotengine/godot-cpp.git native/carpathian/godot-cpp
          printf '%s\n' '{"enabled_classes":["RefCounted","OS"]}' > native/carpathian/build_profile.json
          cat > native/carpathian/SConstruct <<'PY'
          #!/usr/bin/env python
          env = SConscript("godot-cpp/SConstruct")
          env.Append(CPPPATH=["src/"])
          sources = Glob("src/*.cpp")
          library = env.SharedLibrary("bin/libteknik_carpathian{}{}".format(env["suffix"], env["SHLIBSUFFIX"]), source=sources)
          env.NoCache(library)
          Default(library)
          PY
          scons -C native/carpathian platform=android target=template_debug arch=arm64 android_api_level=24 ndk_version=23.2.8568313 build_profile=build_profile.json ANDROID_HOME="$ANDROID_HOME" -j2
          LIB_PATH="$(find native/carpathian/bin -maxdepth 1 -type f -name '*.so' | head -n 1)"
          test -n "$LIB_PATH"
          LIB_NAME="$(basename "$LIB_PATH")"
          cat > native/carpathian/teknik_carpathian.gdextension <<EOF
          [configuration]
          entry_symbol = "teknik_carpathian_library_init"
          compatibility_minimum = "4.3"

          [libraries]
          android.debug.arm64 = "res://native/carpathian/bin/$LIB_NAME"
          EOF
          rm -rf native/carpathian/godot-cpp

      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpack
          cp -a /tmp/godot-template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          /tmp/godot/godot --version

      - name: Validate project and water scripts
        run: |
          /tmp/godot/godot --headless --path "$GITHUB_WORKSPACE" --editor --quit 2>&1 | tee project-parse.log
          ! grep -E "SCRIPT ERROR|Parse Error" project-parse.log
          test -s scripts/world/localized_water_bodies.gd
          test -s scripts/world/localized_water_mesh_builder.gd

      - name: Run dedicated water mesher gate
        run: |
          /tmp/godot/godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/water_mesher_gate.gd 2>&1 | tee water-mesher-gate.log
          grep -Fq "WATER_MESHER_GATE_PASS" water-mesher-gate.log

      - name: Export one optimized Android APK
        run: |
          /tmp/godot/godot --headless --path "$GITHUB_WORKSPACE" --install-android-build-template --export-debug "Android Debug" "$GITHUB_WORKSPACE/TEKNIK-water-optimized.apk" 2>&1 | tee export.log
          test -s TEKNIK-water-optimized.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs TEKNIK-water-optimized.apk
          unzip -Z1 TEKNIK-water-optimized.apk | grep -F 'libteknik_carpathian' >/dev/null
          sha256sum TEKNIK-water-optimized.apk | tee apk-sha256.txt

      - name: Upload single optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: teknik-water-optimized-apk
          path: |
            TEKNIK-water-optimized.apk
            project-parse.log
            water-mesher-gate.log
            export.log
            apk-sha256.txt
          if-no-files-found: error
          compression-level: 0
