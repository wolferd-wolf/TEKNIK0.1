name: Patch touch Step 2 indices

on:
  pull_request:
    branches:
      - session/touch-controls-android-export

permissions:
  contents: write

jobs:
  patch-indices:
    if: github.head_ref == 'validation/touch-drag-look-step2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/touch-drag-look-step2
          fetch-depth: 0

      - name: Use valid simulated touch indices
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/touch_drag_look_step2_gate.gd')
          text = path.read_text()
          replacements = {
              '_simulate_touch(11,': '_simulate_touch(1,',
              '_simulate_drag(11,': '_simulate_drag(1,',
              '!= 11': '!= 1',
              '_simulate_touch(22,': '_simulate_touch(2,',
              '_simulate_drag(22,': '_simulate_drag(2,',
              '!= 22': '!= 2',
              '_simulate_touch(33,': '_simulate_touch(3,',
              '_simulate_drag(33,': '_simulate_drag(3,',
              '!= 33': '!= 3',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/touch_drag_look_step2_gate.gd
          git commit -m "[TEKNIK] validation: use supported touch indices"
          git push origin HEAD:validation/touch-drag-look-step2
