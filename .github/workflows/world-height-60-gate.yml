name: TEKNIK WORLD_HEIGHT 60 Gate

on:
  pull_request:
    paths:
      - 'scripts/world/playable_world_generation_data.gd'
      - 'scripts/world/playable_world_generation_runtime.gd'
      - 'scripts/world/playable_world_stage13_data.gd'
      - 'scripts/world/playable_world_stage13_generation_cache_fast.gd'
      - 'tests/world_height_60_gate.gd'
      - 'tests/world_height_60_benchmark.gd'
      - '.github/workflows/world-height-60-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-height-60:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Parse strict
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-height-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/world-height-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/world-height-parse.log; then
            exit 1
          fi

      - name: Validate terrain shape
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-height-shape" \
            timeout 300 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/world_height_60_gate.gd \
              2>&1 | tee artifacts/world-height-60.log
          grep -Fq 'WORLD_HEIGHT_60_GATE_PASS' artifacts/world-height-60.log

      - name: Benchmark real chunk generation and meshing
        if: always()
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-height-benchmark" \
            timeout 300 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/world_height_60_benchmark.gd \
              2>&1 | tee artifacts/world-height-60-benchmark.log
          grep -Fq 'WORLD_HEIGHT_60_BENCHMARK_PASS' artifacts/world-height-60-benchmark.log

      - name: Upload height evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-height-60-evidence
          path: artifacts/
          if-no-files-found: error
