name: TEKNIK Plains Transition Tree Bleed Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/world/playable_world_stage10_region_data.gd'
      - 'tests/plains_transition_tree_bleed_gate.gd'
      - '.github/workflows/plains-transition-tree-bleed-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tree-bleed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Run Plains transition tree-bleed gate
        run: |
          mkdir -p artifacts/plains-transition-tree-bleed
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/plains-transition-tree-bleed" timeout 180 \
            /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/plains_transition_tree_bleed_gate.gd \
            2>&1 | tee artifacts/plains-transition-tree-bleed/gate.log

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plains-transition-tree-bleed-evidence
          path: artifacts/plains-transition-tree-bleed/
          if-no-files-found: error
