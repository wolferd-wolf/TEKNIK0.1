name: TEKNIK Vanilla Minecraft Lighting Gate

on:
  push:
    branches:
      - session/polish-world-fixes
    paths:
      - scenes/main.tscn
      - scripts/world/playable_world_mesher.gd
      - scripts/world/playable_world_port.gd
      - scripts/world/playable_world_runtime.gd
      - tests/polish_minecraft_shadows_gate.gd
      - tests/vanilla_lighting_boundary_gate.gd
      - tests/edge_cases_step5_gate.gd
      - .github/workflows/polish-minecraft-shadows-gate.yml
  pull_request:
    branches:
      - main
    paths:
      - scenes/main.tscn
      - scripts/world/playable_world_mesher.gd
      - scripts/world/playable_world_port.gd
      - scripts/world/playable_world_runtime.gd
      - tests/polish_minecraft_shadows_gate.gd
      - tests/vanilla_lighting_boundary_gate.gd
      - tests/edge_cases_step5_gate.gd
      - .github/workflows/polish-minecraft-shadows-gate.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  vanilla-lighting-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget unzip xvfb libgl1 libx11-6 libxcursor1 libxinerama1 \
            libxi6 libxrandr2 libxrender1 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project
        run: |
          mkdir -p artifacts
          /tmp/godot/godot --headless --path "$GITHUB_WORKSPACE" --editor --quit-after 3 \
            2>&1 | tee artifacts/parse.log
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script' artifacts/parse.log

      - name: Run reviewed classic vanilla lighting gate
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path "$GITHUB_WORKSPACE" \
            --script res://tests/polish_minecraft_shadows_gate.gd \
            2>&1 | tee artifacts/vanilla-lighting-gate.log
          grep -Fq 'VANILLA_FACE_DIMMING_PASS' artifacts/vanilla-lighting-gate.log
          grep -Fq 'VANILLA_CORNER_AO_PASS' artifacts/vanilla-lighting-gate.log
          grep -Fq 'VANILLA_SKYLIGHT_PASS' artifacts/vanilla-lighting-gate.log
          grep -Fq 'VANILLA_LIGHTING_GATE_PASS' artifacts/vanilla-lighting-gate.log
          test -s artifacts/vanilla-lighting.png

      - name: Run chunk-boundary lighting gate
        run: |
          set -o pipefail
          timeout 120 /tmp/godot/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --script res://tests/vanilla_lighting_boundary_gate.gd \
            2>&1 | tee artifacts/vanilla-lighting-boundary-gate.log
          grep -Fq 'VANILLA_LIGHTING_CACHE_BORDER_PASS' artifacts/vanilla-lighting-boundary-gate.log
          grep -Fq 'VANILLA_LIGHTING_DIAGONAL_REMESH_PASS' artifacts/vanilla-lighting-boundary-gate.log

      - name: Upload vanilla lighting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-vanilla-minecraft-lighting
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

      - name: Publish vanilla lighting status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'TEKNIK Vanilla Lighting Gate',
              description: '${{ job.status }}' === 'success'
                ? 'Face dimming, AO, skylight and boundaries passed'
                : 'Classic vanilla lighting gate failed'
            });
