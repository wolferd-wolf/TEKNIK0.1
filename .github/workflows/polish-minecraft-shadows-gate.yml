name: TEKNIK Polish Minecraft Shadows Gate

on:
  push:
    branches:
      - session/polish-world-fixes
    paths:
      - scenes/main.tscn
      - tests/polish_minecraft_shadows_gate.gd
      - .github/workflows/polish-minecraft-shadows-gate.yml
  pull_request:
    branches:
      - main
    paths:
      - scenes/main.tscn
      - tests/polish_minecraft_shadows_gate.gd
      - .github/workflows/polish-minecraft-shadows-gate.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  minecraft-shadows-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget unzip xvfb libgl1 libx11-6 libxcursor1 libxinerama1 \
            libxi6 libxrandr2 libxrender1 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project
        run: |
          mkdir -p artifacts
          /tmp/godot/godot --headless --path "$GITHUB_WORKSPACE" --editor --quit-after 3 \
            2>&1 | tee artifacts/parse.log
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script' artifacts/parse.log

      - name: Run real-tree shadow artifact gate
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path "$GITHUB_WORKSPACE" \
            --script res://tests/polish_minecraft_shadows_gate.gd \
            2>&1 | tee artifacts/shadow-gate.log
          grep -Fq 'POLISH_MINECRAFT_SHADOWS_GATE_PASS' artifacts/shadow-gate.log
          test -s artifacts/shadow-artifact-after.png

      - name: Verify corrective shadow scope
        run: |
          base="ca397377d7d8d612f32aa98bdaefceec6d0e52c4"
          git diff --name-only "$base" "$GITHUB_SHA" | sort | tee artifacts/changed-files.txt
          allowed='^(scenes/main\.tscn|tests/polish_minecraft_shadows_gate\.gd|\.github/workflows/polish-minecraft-shadows-gate\.yml)$'
          if grep -Ev "$allowed" artifacts/changed-files.txt | grep -q .; then
            echo 'Unexpected files in shadow artifact correction.' >&2
            exit 1
          fi
          ! grep -q '^export_presets.cfg$' artifacts/changed-files.txt
          ! grep -q '^scripts/world/' artifacts/changed-files.txt

      - name: Upload shadow visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-polish-shadow-artifact-fix
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

      - name: Publish shadow artifact commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'TEKNIK Shadow Artifact Gate',
              description: '${{ job.status }}' === 'success'
                ? 'Reverse-cull tree shadow capture passed'
                : 'Tree shadow artifact gate failed'
            });
