name: TEKNIK Polish Step 1 APK Size Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/polish-step1-apk-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audit-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout exact revision with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record audit source
        run: |
          mkdir -p artifacts/extracted
          git rev-parse HEAD | tee artifacts/source-commit.txt
          git status --short | tee artifacts/source-status.txt

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget binutils file

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and verify debug keystore
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${RUNNER_TEMP}/teknik-debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}" >> "$GITHUB_ENV"
          bash scripts/android/setup_debug_keystore.sh "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            2>&1 | tee artifacts/debug-keystore.log
          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK requirements
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3 and matching export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpack
          cp -a /tmp/godot-template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

          /tmp/godot/godot --version | tee artifacts/godot-version.txt
          java -version 2>&1 | tee artifacts/java-version.txt

      - name: Export the current Android debug APK once
        id: export
        shell: bash
        run: |
          set +e
          set -o pipefail
          apk="/tmp/TEKNIK-0.1-step1-audit-debug.apk"
          command=(
            /tmp/godot/godot
            --headless
            --verbose
            --path "$GITHUB_WORKSPACE"
            --install-android-build-template
            --export-debug "Android Debug"
            "$apk"
          )
          {
            printf 'Exact command:'
            printf ' %q' "${command[@]}"
            printf '\nPreset: Android Debug\nMode: --export-debug\nOutput: %s\n' "$apk"
          } | tee artifacts/export-mode.txt
          "${command[@]}" 2>&1 | tee artifacts/godot-android-export.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee artifacts/export-exit-code.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail if the diagnostic export did not complete
        if: steps.export.outputs.status != '0'
        run: |
          echo "Diagnostic APK export failed; no size conclusions are valid." >&2
          exit 1

      - name: Inventory APK, assets, duplicates, and port contribution
        if: steps.export.outputs.status == '0'
        run: |
          port_merge="$(git log --all --grep='Merge pull request #27' --format='%H' -1 || true)"
          : > artifacts/port-files.txt
          if [[ -n "$port_merge" ]]; then
            git diff --name-only --diff-filter=AMR "${port_merge}^1" "$port_merge" | sort -u > artifacts/port-files.txt
          fi
          git rev-list --objects --all | awk '$2 ~ /\.apk$/ {print}' > artifacts/apk-history-objects.txt || true

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import zipfile
          from collections import defaultdict

          APK = '/tmp/TEKNIK-0.1-step1-audit-debug.apk'
          OUT = 'artifacts'
          EXTRACT = os.path.join(OUT, 'extracted')
          os.makedirs(EXTRACT, exist_ok=True)

          with open(os.path.join(OUT, 'port-files.txt')) as f:
              port_source_paths = {line.strip() for line in f if line.strip()}

          def overall_category(path):
              low = path.lower()
              if low.startswith('lib/') and low.endswith('/libgodot_android.so'):
                  return 'Godot engine/runtime (native)'
              if low.startswith('lib/') and low.endswith('.so'):
                  return 'Other native libraries'
              if low.startswith('classes') and low.endswith('.dex'):
                  return 'Android bytecode (DEX)'
              if low.startswith('assets/'):
                  return 'Godot project assets'
              if low == 'androidmanifest.xml' or low == 'resources.arsc' or low.startswith('res/'):
                  return 'Android resources/manifest'
              if low.startswith('meta-inf/'):
                  return 'Signing metadata'
              return 'Other APK packaging'

          def asset_category(path):
              low = path.lower()
              ext = os.path.splitext(low)[1]
              if low.startswith('assets/tests/'):
                  return 'Tests/diagnostic code'
              if ext in {'.ctex', '.stex'}:
                  return 'Imported texture data'
              if ext in {'.png', '.jpg', '.jpeg', '.webp', '.bmp', '.tga', '.svg'}:
                  return 'Raw image sources'
              if ext in {'.ogg', '.wav', '.mp3'}:
                  return 'Audio'
              if ext in {'.ttf', '.otf', '.woff', '.woff2'}:
                  return 'Fonts'
              if ext in {'.gdc', '.gd'}:
                  return 'Runtime scripts'
              if ext in {'.scn', '.tscn', '.tres', '.res'}:
                  return 'Scenes/resources'
              if ext in {'.gdshader', '.shader', '.glsl'}:
                  return 'Shaders'
              if ext in {'.remap', '.import'}:
                  return 'Import/remap metadata'
              if low.endswith('project.binary') or '/.godot/' in low:
                  return 'Project configuration/cache'
              return 'Other project data'

          def asset_to_source_candidates(asset_path):
              rel = asset_path.removeprefix('assets/')
              candidates = {rel}
              if rel.endswith('.gdc'):
                  candidates.add(rel[:-4] + '.gd')
              if rel.endswith('.gd.remap'):
                  candidates.add(rel[:-6])
              if rel.endswith('.scn'):
                  candidates.add(rel[:-4] + '.tscn')
              if rel.endswith('.tscn.remap'):
                  candidates.add(rel[:-6])
              return candidates

          def is_port_asset(asset_path):
              candidates = asset_to_source_candidates(asset_path)
              if candidates & port_source_paths:
                  return True
              return 'playable_world_' in asset_path.lower()

          overall_rows = []
          asset_rows = []
          overall_totals = defaultdict(lambda: {'compressed': 0, 'uncompressed': 0, 'count': 0})
          asset_totals = defaultdict(lambda: {'compressed': 0, 'uncompressed': 0, 'count': 0})
          asset_hashes = defaultdict(list)
          native_entries = []
          template_entries = []

          with zipfile.ZipFile(APK) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  cat = overall_category(info.filename)
                  overall_rows.append({
                      'category': cat,
                      'path': info.filename,
                      'compressed_bytes': info.compress_size,
                      'uncompressed_bytes': info.file_size,
                      'compression_method': info.compress_type,
                  })
                  overall_totals[cat]['compressed'] += info.compress_size
                  overall_totals[cat]['uncompressed'] += info.file_size
                  overall_totals[cat]['count'] += 1

                  low = info.filename.lower()
                  if low.startswith('lib/') and low.endswith('.so'):
                      native_entries.append(info.filename)
                      z.extract(info, EXTRACT)
                  if low.startswith('lib/') and low.endswith('/libgodot_android.so'):
                      template_entries.append(info.filename)

                  if low.startswith('assets/'):
                      data = z.read(info)
                      digest = hashlib.sha256(data).hexdigest()
                      acat = asset_category(info.filename)
                      port_related = is_port_asset(info.filename)
                      row = {
                          'category': acat,
                          'path': info.filename,
                          'compressed_bytes': info.compress_size,
                          'uncompressed_bytes': info.file_size,
                          'sha256': digest,
                          'port_related': port_related,
                      }
                      asset_rows.append(row)
                      asset_totals[acat]['compressed'] += info.compress_size
                      asset_totals[acat]['uncompressed'] += info.file_size
                      asset_totals[acat]['count'] += 1
                      asset_hashes[(digest, info.file_size)].append(row)

          apk_size = os.path.getsize(APK)
          compressed_entry_sum = sum(r['compressed_bytes'] for r in overall_rows)
          overhead = max(0, apk_size - compressed_entry_sum)
          overall_totals['ZIP alignment/central-directory overhead'] = {
              'compressed': overhead,
              'uncompressed': overhead,
              'count': 1,
          }

          overall_summary = []
          for category, values in overall_totals.items():
              overall_summary.append({
                  'category': category,
                  'compressed_bytes': values['compressed'],
                  'compressed_mib': round(values['compressed'] / 1048576, 6),
                  'percent_of_apk': round(values['compressed'] * 100 / apk_size, 6),
                  'uncompressed_bytes': values['uncompressed'],
                  'uncompressed_mib': round(values['uncompressed'] / 1048576, 6),
                  'entry_count': values['count'],
              })
          overall_summary.sort(key=lambda x: x['compressed_bytes'], reverse=True)

          total_asset_compressed = sum(r['compressed_bytes'] for r in asset_rows)
          total_asset_uncompressed = sum(r['uncompressed_bytes'] for r in asset_rows)
          asset_summary = []
          for category, values in asset_totals.items():
              asset_summary.append({
                  'category': category,
                  'compressed_bytes': values['compressed'],
                  'compressed_kib': round(values['compressed'] / 1024, 3),
                  'percent_of_asset_compressed': round(values['compressed'] * 100 / total_asset_compressed, 6) if total_asset_compressed else 0,
                  'uncompressed_bytes': values['uncompressed'],
                  'uncompressed_kib': round(values['uncompressed'] / 1024, 3),
                  'file_count': values['count'],
              })
          asset_summary.sort(key=lambda x: x['compressed_bytes'], reverse=True)

          duplicates = []
          duplicate_waste_compressed = 0
          duplicate_waste_uncompressed = 0
          port_duplicate_waste_compressed = 0
          for (_, size), group in asset_hashes.items():
              if size <= 0 or len(group) < 2:
                  continue
              group_sorted = sorted(group, key=lambda r: r['compressed_bytes'], reverse=True)
              compressed_waste = sum(r['compressed_bytes'] for r in group_sorted[1:])
              uncompressed_waste = size * (len(group_sorted) - 1)
              port_related = any(r['port_related'] for r in group_sorted)
              duplicate_waste_compressed += compressed_waste
              duplicate_waste_uncompressed += uncompressed_waste
              if port_related:
                  port_duplicate_waste_compressed += compressed_waste
              duplicates.append({
                  'sha256': group_sorted[0]['sha256'],
                  'uncompressed_bytes_each': size,
                  'copies': len(group_sorted),
                  'compressed_waste_bytes': compressed_waste,
                  'uncompressed_waste_bytes': uncompressed_waste,
                  'port_related': port_related,
                  'paths': [r['path'] for r in group_sorted],
              })
          duplicates.sort(key=lambda x: x['compressed_waste_bytes'], reverse=True)

          port_rows = [r for r in asset_rows if r['port_related']]
          port_compressed = sum(r['compressed_bytes'] for r in port_rows)
          port_uncompressed = sum(r['uncompressed_bytes'] for r in port_rows)

          def write_csv(path, rows, fields=None):
              with open(path, 'w', newline='') as f:
                  if not rows:
                      f.write('')
                      return
                  fields = fields or list(rows[0].keys())
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows)

          overall_rows.sort(key=lambda x: x['compressed_bytes'], reverse=True)
          asset_rows.sort(key=lambda x: x['compressed_bytes'], reverse=True)
          port_rows.sort(key=lambda x: x['compressed_bytes'], reverse=True)
          write_csv(os.path.join(OUT, 'apk-category-breakdown.csv'), overall_summary)
          write_csv(os.path.join(OUT, 'apk-entries.csv'), overall_rows)
          write_csv(os.path.join(OUT, 'asset-category-breakdown.csv'), asset_summary)
          write_csv(os.path.join(OUT, 'asset-entries.csv'), asset_rows)
          write_csv(os.path.join(OUT, 'port-packaged-entries.csv'), port_rows)
          with open(os.path.join(OUT, 'asset-duplicate-groups.json'), 'w') as f:
              json.dump(duplicates, f, indent=2)
          with open(os.path.join(OUT, 'native-library-entries.txt'), 'w') as f:
              f.write('\n'.join(native_entries) + ('\n' if native_entries else ''))
          with open(os.path.join(OUT, 'native-template-entries.txt'), 'w') as f:
              f.write('\n'.join(template_entries) + ('\n' if template_entries else ''))
          with open(os.path.join(OUT, 'apk-size.txt'), 'w') as f:
              f.write(f'size_bytes={apk_size}\n')
              f.write(f'size_mib={apk_size/1048576:.6f}\n')
              f.write(f'size_decimal_mb={apk_size/1000000:.6f}\n')
          with open(os.path.join(OUT, 'asset-summary.txt'), 'w') as f:
              f.write(f'asset_compressed_bytes={total_asset_compressed}\n')
              f.write(f'asset_compressed_mib={total_asset_compressed/1048576:.6f}\n')
              f.write(f'asset_uncompressed_bytes={total_asset_uncompressed}\n')
              f.write(f'asset_uncompressed_mib={total_asset_uncompressed/1048576:.6f}\n')
              f.write(f'asset_file_count={len(asset_rows)}\n')
              f.write(f'exact_duplicate_group_count={len(duplicates)}\n')
              f.write(f'exact_duplicate_compressed_waste_bytes={duplicate_waste_compressed}\n')
              f.write(f'exact_duplicate_compressed_waste_kib={duplicate_waste_compressed/1024:.6f}\n')
              f.write(f'exact_duplicate_uncompressed_waste_bytes={duplicate_waste_uncompressed}\n')
              f.write(f'port_related_duplicate_compressed_waste_bytes={port_duplicate_waste_compressed}\n')
              f.write(f'port_related_duplicate_compressed_waste_kib={port_duplicate_waste_compressed/1024:.6f}\n')
              f.write(f'port_packaged_compressed_bytes={port_compressed}\n')
              f.write(f'port_packaged_compressed_kib={port_compressed/1024:.6f}\n')
              f.write(f'port_packaged_uncompressed_bytes={port_uncompressed}\n')
              f.write(f'port_packaged_uncompressed_kib={port_uncompressed/1024:.6f}\n')
              f.write(f'port_packaged_entry_count={len(port_rows)}\n')
              f.write(f'native_library_entry_count={len(native_entries)}\n')
              f.write(f'native_template_entry_count={len(template_entries)}\n')

          with open(os.path.join(OUT, 'top-apk-entries.txt'), 'w') as f:
              for row in overall_rows[:100]:
                  f.write(f"{row['compressed_bytes']:>12}\t{row['uncompressed_bytes']:>12}\t{row['category']}\t{row['path']}\n")
          with open(os.path.join(OUT, 'top-asset-entries.txt'), 'w') as f:
              for row in asset_rows[:100]:
                  f.write(f"{row['compressed_bytes']:>10}\t{row['uncompressed_bytes']:>10}\t{row['category']}\tport={row['port_related']}\t{row['path']}\n")

          print('=== APK CATEGORY BREAKDOWN ===')
          for row in overall_summary:
              print(json.dumps(row, sort_keys=True))
          print('=== ASSET CATEGORY BREAKDOWN ===')
          for row in asset_summary:
              print(json.dumps(row, sort_keys=True))
          print('=== ASSET SUMMARY ===')
          print(open(os.path.join(OUT, 'asset-summary.txt')).read())
          print('=== PORT PACKAGED ENTRIES ===')
          for row in port_rows:
              print(json.dumps(row, sort_keys=True))
          print('=== EXACT DUPLICATE GROUPS ===')
          print(json.dumps(duplicates, indent=2))
          PY

      - name: Confirm build mode, ABI count, native templates, and symbol sections
        if: steps.export.outputs.status == '0'
        shell: bash
        run: |
          apk="/tmp/TEKNIK-0.1-step1-audit-debug.apk"
          {
            echo 'Export evidence:'
            cat artifacts/export-mode.txt
            echo
            echo 'Preset evidence:'
            sed -n '1,120p' export_presets.cfg
            echo
            echo 'Manifest and ABI evidence:'
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -E 'package:|application-debuggable|native-code' || true
            echo
            echo 'Signature evidence:'
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" || true
            echo
            echo 'Godot native template entries:'
            cat artifacts/native-template-entries.txt
            echo
            echo 'All native libraries and ELF symbol inspection:'
            while IFS= read -r entry; do
              [[ -n "$entry" ]] || continue
              extracted="artifacts/extracted/$entry"
              echo "--- $entry ---"
              file "$extracted" || true
              readelf -S "$extracted" | grep -E '\.debug_|\.symtab|\.strtab' || echo 'No .debug_* or .symtab section found'
            done < artifacts/native-library-entries.txt
          } 2>&1 | tee artifacts/build-mode-and-native-inspection.txt

      - name: Audit current source-tree exact duplicates
        if: steps.export.outputs.status == '0'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from collections import defaultdict

          port_paths = set()
          with open('artifacts/port-files.txt') as f:
              port_paths = {line.strip() for line in f if line.strip()}

          excluded = {'.git', '.godot', 'artifacts'}
          groups = defaultdict(list)
          rows = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in excluded and not (root == '.' and d == 'android')]
              for name in files:
                  path = os.path.normpath(os.path.join(root, name)).lstrip('./')
                  if path.startswith('android/build/'):
                      continue
                  try:
                      size = os.path.getsize(path)
                      h = hashlib.sha256()
                      with open(path, 'rb') as f:
                          for chunk in iter(lambda: f.read(1024 * 1024), b''):
                              h.update(chunk)
                  except OSError:
                      continue
                  row = {'path': path, 'bytes': size, 'sha256': h.hexdigest(), 'port_related': path in port_paths}
                  rows.append(row)
                  groups[(row['sha256'], size)].append(row)

          duplicates = []
          waste = 0
          port_waste = 0
          for (_, size), group in groups.items():
              if size <= 0 or len(group) < 2:
                  continue
              group_waste = size * (len(group) - 1)
              related = any(r['port_related'] for r in group)
              waste += group_waste
              if related:
                  port_waste += group_waste
              duplicates.append({
                  'bytes_each': size,
                  'copies': len(group),
                  'wasted_bytes': group_waste,
                  'port_related': related,
                  'paths': [r['path'] for r in group],
              })
          duplicates.sort(key=lambda x: x['wasted_bytes'], reverse=True)
          port_existing = [r for r in rows if r['path'] in port_paths]

          with open('artifacts/source-duplicate-groups.json', 'w') as f:
              json.dump(duplicates, f, indent=2)
          with open('artifacts/source-duplicate-summary.txt', 'w') as f:
              f.write(f'source_duplicate_group_count={len(duplicates)}\n')
              f.write(f'source_duplicate_wasted_bytes={waste}\n')
              f.write(f'source_duplicate_wasted_kib={waste/1024:.6f}\n')
              f.write(f'port_related_source_duplicate_wasted_bytes={port_waste}\n')
              f.write(f'port_related_source_duplicate_wasted_kib={port_waste/1024:.6f}\n')
              f.write(f'port_current_file_count={len(port_existing)}\n')
              f.write(f'port_current_total_bytes={sum(r["bytes"] for r in port_existing)}\n')
              f.write(f'port_current_total_kib={sum(r["bytes"] for r in port_existing)/1024:.6f}\n')
          print(open('artifacts/source-duplicate-summary.txt').read())
          print(json.dumps(duplicates, indent=2))
          PY

      - name: Build and print concise audit report
        if: steps.export.outputs.status == '0'
        run: |
          python3 - <<'PY'
          import csv
          import os

          def kv(path):
              result = {}
              with open(path) as f:
                  for line in f:
                      if '=' in line:
                          key, value = line.rstrip().split('=', 1)
                          result[key] = value
              return result

          with open('artifacts/apk-category-breakdown.csv') as f:
              apk_rows = list(csv.DictReader(f))
          with open('artifacts/asset-category-breakdown.csv') as f:
              asset_rows = list(csv.DictReader(f))
          apk = kv('artifacts/apk-size.txt')
          assets = kv('artifacts/asset-summary.txt')
          source = kv('artifacts/source-duplicate-summary.txt')
          history = open('artifacts/apk-history-objects.txt').read().strip()
          native_template_entries = [line.strip() for line in open('artifacts/native-template-entries.txt') if line.strip()]

          with open('artifacts/audit-report.md', 'w') as f:
              f.write('# TEKNIK Step 1 APK Size Audit\n\n')
              f.write(f"- Source commit: `{open('artifacts/source-commit.txt').read().strip()}`\n")
              f.write(f"- APK: **{apk['size_decimal_mb']} MB decimal / {apk['size_mib']} MiB** ({apk['size_bytes']} bytes).\n")
              f.write('- Build type: **Debug** (`--export-debug`, `Android Debug` preset, debuggable manifest, Android Debug certificate).\n')
              f.write('- Architecture: **ARM64 only** (`arm64-v8a`).\n')
              f.write(f"- Packaged Godot native templates: **{len(native_template_entries)}** ({', '.join(native_template_entries)}).\n")
              f.write('- Native ELF inspection: detailed in `build-mode-and-native-inspection.txt`; audit requires explicit symbol-section evidence.\n\n')

              f.write('## Compressed APK breakdown\n\n')
              f.write('| Category | Compressed MiB | APK share | Uncompressed MiB | Entries |\n|---|---:|---:|---:|---:|\n')
              for row in apk_rows:
                  f.write(f"| {row['category']} | {row['compressed_mib']} | {row['percent_of_apk']}% | {row['uncompressed_mib']} | {row['entry_count']} |\n")

              f.write('\n## Packaged Godot asset breakdown\n\n')
              f.write('| Asset category | Compressed KiB | Asset share | Uncompressed KiB | Files |\n|---|---:|---:|---:|---:|\n')
              for row in asset_rows:
                  f.write(f"| {row['category']} | {row['compressed_kib']} | {row['percent_of_asset_compressed']}% | {row['uncompressed_kib']} | {row['file_count']} |\n")

              f.write('\n## Duplication and old-port accounting\n\n')
              f.write(f"- Exact duplicate packaged-asset waste: **{assets['exact_duplicate_compressed_waste_kib']} KiB compressed** across {assets['exact_duplicate_group_count']} groups.\n")
              f.write(f"- Exact duplicate packaged-asset waste involving the PR #27 old-world port: **{assets['port_related_duplicate_compressed_waste_kib']} KiB compressed**.\n")
              f.write(f"- Total packaged entries attributed to the PR #27 old-world port: **{assets['port_packaged_compressed_kib']} KiB compressed / {assets['port_packaged_uncompressed_kib']} KiB uncompressed**, {assets['port_packaged_entry_count']} entries.\n")
              f.write(f"- Current source-tree exact duplicate waste: **{source['source_duplicate_wasted_kib']} KiB**.\n")
              f.write(f"- Source duplicate waste involving a PR #27 path: **{source['port_related_source_duplicate_wasted_kib']} KiB**.\n")

              f.write('\n## Old 28 MB build availability\n\n')
              if history:
                  f.write('APK objects were found in repository history; see `apk-history-objects.txt` for identifiers.\n')
              else:
                  f.write('No prior APK object exists in the checked Git history, so the claimed old 28 MB build cannot be decomposed entry-for-entry from repository data.\n')
          PY

          cat artifacts/audit-report.md
          echo
          echo '=== Native/symbol evidence ==='
          cat artifacts/build-mode-and-native-inspection.txt
          echo
          echo '=== Largest APK entries ==='
          sed -n '1,30p' artifacts/top-apk-entries.txt
          echo
          echo '=== Largest packaged assets ==='
          sed -n '1,80p' artifacts/top-asset-entries.txt

      - name: Upload Step 1 APK audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknik-polish-step1-apk-size-audit
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

      - name: Publish Step 1 audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          description='APK audit failed; inspect the workflow logs and artifact.'
          if [[ "$JOB_STATUS" == 'success' && -f artifacts/apk-size.txt && -f artifacts/audit-report.md ]]; then
            state=success
            mib="$(awk -F= '$1=="size_mib" {print $2}' artifacts/apk-size.txt)"
            description="APK audit complete: ${mib} MiB; detailed artifact uploaded."
          fi
          python3 - "$state" "$description" "$RUN_URL" > /tmp/status.json <<'PY'
          import json
          import sys
          print(json.dumps({
              'state': sys.argv[1],
              'description': sys.argv[2][:140],
              'context': 'TEKNIK Step 1 APK Audit',
              'target_url': sys.argv[3],
          }))
          PY
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d @/tmp/status.json
