name: TEKNIK Vanilla Lighting Fast Look Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vanilla-lighting-fast-look:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee artifacts/vanilla-lighting-fast-look-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/vanilla-lighting-fast-look-parse.log; then
            exit 1
          fi

      - name: Validate baked lighting and mobile look speed
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/vanilla_lighting_fast_look_gate.gd \
            2>&1 | tee artifacts/vanilla-lighting-fast-look.log
          grep -F "VANILLA_LIGHTING_FAST_LOOK_GATE_PASS" artifacts/vanilla-lighting-fast-look.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-lighting-fast-look-evidence
          path: artifacts/
          if-no-files-found: error
