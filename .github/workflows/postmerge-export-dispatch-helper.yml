name: TEKNIK Post-Merge Export Dispatch Helper

on:
  push:
    branches: [session/touch-controls-android-export]

permissions:
  actions: write
  contents: write

jobs:
  dispatch-after-main-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_MAIN_SHA: b6a8a63c25ceda2c469147d61a837f37a9939063
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: session/touch-controls-android-export
          fetch-depth: 0

      - name: Wait for exact main acceptance and dispatch export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          actual_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$actual_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main moved: expected $EXPECTED_MAIN_SHA, got $actual_main_sha" >&2
            exit 1
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(--header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28")
          mkdir -p .automation

          acceptance_id=""
          acceptance_status=""
          acceptance_conclusion=""
          acceptance_url=""
          for _ in $(seq 1 180); do
            curl -fsSL "${auth[@]}" "${api}/actions/workflows/acceptance-gate.yml/runs?branch=main&event=push&per_page=30" > /tmp/acceptance-runs.json
            readarray -t fields < <(python3 - "$EXPECTED_MAIN_SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          data = json.load(open('/tmp/acceptance-runs.json'))
          run = next((r for r in data.get('workflow_runs', []) if r.get('head_sha') == sha), None)
          if run:
              print(run.get('id', ''))
              print(run.get('status', ''))
              print(run.get('conclusion') or '')
              print(run.get('html_url', ''))
          PY
            )
            if [[ ${#fields[@]} -ge 4 ]]; then
              acceptance_id="${fields[0]}"
              acceptance_status="${fields[1]}"
              acceptance_conclusion="${fields[2]}"
              acceptance_url="${fields[3]}"
              echo "acceptance run ${acceptance_id}: ${acceptance_status}/${acceptance_conclusion}"
              if [[ "$acceptance_status" == "completed" ]]; then
                break
              fi
            fi
            sleep 10
          done

          if [[ -z "$acceptance_id" || "$acceptance_status" != "completed" ]]; then
            echo 'Exact post-merge acceptance run was not observed completing.' >&2
            exit 1
          fi

          export_id=""
          export_status=""
          export_conclusion=""
          export_url=""
          dispatched_at=""
          if [[ "$acceptance_conclusion" == "success" ]]; then
            dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsSL -X POST "${auth[@]}" \
              "${api}/actions/workflows/android-export-step5.yml/dispatches" \
              --data '{"ref":"main"}'

            for _ in $(seq 1 60); do
              curl -fsSL "${auth[@]}" "${api}/actions/workflows/android-export-step5.yml/runs?branch=main&event=workflow_dispatch&per_page=30" > /tmp/export-runs.json
              readarray -t fields < <(python3 - "$EXPECTED_MAIN_SHA" "$dispatched_at" <<'PY'
          import json, sys
          from datetime import datetime
          sha, dispatched = sys.argv[1], sys.argv[2]
          threshold = datetime.fromisoformat(dispatched.replace('Z', '+00:00'))
          data = json.load(open('/tmp/export-runs.json'))
          candidates = []
          for run in data.get('workflow_runs', []):
              if run.get('head_sha') != sha:
                  continue
              created = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              if created >= threshold:
                  candidates.append(run)
          if candidates:
              run = sorted(candidates, key=lambda r: r['created_at'], reverse=True)[0]
              print(run.get('id', ''))
              print(run.get('status', ''))
              print(run.get('conclusion') or '')
              print(run.get('html_url', ''))
          PY
              )
              if [[ ${#fields[@]} -ge 4 ]]; then
                export_id="${fields[0]}"
                export_status="${fields[1]}"
                export_conclusion="${fields[2]}"
                export_url="${fields[3]}"
                echo "export run ${export_id}: ${export_status}/${export_conclusion}"
                break
              fi
              sleep 5
            done
          fi

          python3 - <<PY
          import json
          result = {
              'main_sha': '$EXPECTED_MAIN_SHA',
              'acceptance': {
                  'run_id': '$acceptance_id',
                  'status': '$acceptance_status',
                  'conclusion': '$acceptance_conclusion',
                  'url': '$acceptance_url',
              },
              'export_dispatch': {
                  'dispatched_at': '$dispatched_at',
                  'run_id': '$export_id',
                  'status': '$export_status',
                  'conclusion': '$export_conclusion',
                  'url': '$export_url',
              },
          }
          open('.automation/main-postmerge-export-dispatch.json', 'w').write(json.dumps(result, indent=2) + '\n')
          PY

          git rm .github/workflows/postmerge-export-dispatch-helper.yml
          git add .automation/main-postmerge-export-dispatch.json
          git commit -m "[TEKNIK] record post-merge export dispatch"
          git push origin HEAD:session/touch-controls-android-export

          if [[ "$acceptance_conclusion" != "success" ]]; then
            echo "Post-merge acceptance failed: ${acceptance_url}" >&2
            exit 1
          fi
          if [[ -z "$export_id" ]]; then
            echo 'Workflow dispatch succeeded but the resulting export run was not identified.' >&2
            exit 1
          fi
