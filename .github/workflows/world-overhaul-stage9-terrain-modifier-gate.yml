name: TEKNIK World Overhaul Stage 9 Terrain Modifier Gate

on:
  pull_request:
    paths:
      - 'scripts/world/playable_world_generation_data.gd'
      - 'scripts/world/playable_world_generation_runtime.gd'
      - 'scripts/world/playable_world_stage9_terrain_data.gd'
      - 'scripts/world/playable_world_stage9_cache_fast.gd'
      - 'scripts/world/playable_world_stage9_mesher.gd'
      - 'scripts/world/playable_world_stage9_frozen_runtime.gd'
      - 'tests/world_overhaul_stage9_terrain_modifier_gate.gd'
      - '.github/workflows/world-overhaul-stage9-terrain-modifier-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage9-terrain-modifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage9-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/world-overhaul-stage9-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/world-overhaul-stage9-parse.log; then
            exit 1
          fi

      - name: Freeze Stage 9 runtime target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tests/world_overhaul_stage9_terrain_modifier_gate.gd').read_text()
          old = 'res://scripts/world/playable_world_generation_runtime.gd'
          new = 'res://scripts/world/playable_world_stage9_frozen_runtime.gd'
          if old not in src:
              raise SystemExit('Stage 9 gate no longer references the public runtime as expected')
          Path('tests/_world_overhaul_stage9_frozen_ci.gd').write_text(src.replace(old, new, 1))
          PY

      - name: Verify terrain modifiers, Stage 8 equivalence, and performance
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage9-modifiers" \
            timeout 300 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/_world_overhaul_stage9_frozen_ci.gd \
              2>&1 | tee artifacts/world-overhaul-stage9-terrain-modifiers.log
          grep -Fq 'WORLD_OVERHAUL_STAGE9_PASS' artifacts/world-overhaul-stage9-terrain-modifiers.log
          grep -Fq 'WORLD_OVERHAUL_STAGE9_JSON=' artifacts/world-overhaul-stage9-terrain-modifiers.log

      - name: Upload Stage 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-overhaul-stage9-terrain-modifier-evidence
          path: artifacts/
          if-no-files-found: error
