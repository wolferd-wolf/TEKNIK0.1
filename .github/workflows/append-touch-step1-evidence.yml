name: Append touch Step 1 evidence

on:
  pull_request:
    branches:
      - session/touch-controls-android-export

permissions:
  contents: write

jobs:
  append-evidence:
    if: github.head_ref == 'validation/touch-joystick-step1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/touch-joystick-step1
          fetch-depth: 0

      - name: Append accepted gate evidence
        run: |
          set -euo pipefail
          cat >> TEKNIK_BUILD_PLAN.md <<'EOF'

          ### Decisions and gate evidence
          - Step 1 virtual joystick: Add one fixed placeholder joystick on the left side of the rendered screen. It captures only a touch that begins within its activation circle, tracks that touch index across drag events, and drives the existing `move_left`, `move_right`, `move_forward`, and `move_backward` InputMap actions with analog strengths. The player controller and desktop keyboard bindings are unchanged; right-side touches are ignored so Step 2 can own drag-look.
          - Step 1 release semantics: Releasing the captured touch, or removing the touch-control node, releases all four movement actions and returns the rendered knob and joystick vector to center/zero. The joystick base occupies `[P: (36, 432), S: (168, 168)]` in the 1280x720 gate viewport and remains above the existing hotbar.
          - Step 1 gate: Actions run `30832858218` passed the complete inherited suite plus simulated `InputEventScreenTouch` and `InputEventScreenDrag` events injected through `Input.parse_input_event`. During an up-right drag, the gate read the actual InputMap states as `move_forward=0.707` and `move_right=0.707`; a down-left drag similarly pressed backward and left, right-side touch was ignored, and release cleared all four actions. The reviewed screenshot shows the rendered joystick deflected up-right with no clipping or graphical crash. Artifact `8863712396` has digest `sha256:64d3c568a9fb6cd98801ec607c13a985bb2a221a168715af336715af0c24ede6`.
          - Step 1 device scope: Touch behavior is verified through desktop touch simulation only at this step. No real Android device or APK is involved until the export steps later in this session.
          EOF
          git rm .github/workflows/append-touch-step1-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEKNIK_BUILD_PLAN.md
          git commit -m "[TEKNIK] step 1: record virtual joystick gate evidence"
          git push origin HEAD:validation/touch-joystick-step1
