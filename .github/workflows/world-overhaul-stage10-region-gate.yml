name: TEKNIK World Overhaul Stage 10 Region Gate

on:
  pull_request:
    paths:
      - 'scripts/world/playable_world_generation_data.gd'
      - 'scripts/world/playable_world_generation_runtime.gd'
      - 'scripts/world/playable_world_stage10_region_data.gd'
      - 'scripts/world/playable_world_stage10_generation_runtime.gd'
      - 'scripts/world/playable_world_stage10_generation_cache_fast.gd'
      - 'scripts/world/playable_world_stage10_cache_fast.gd'
      - 'scripts/world/playable_world_stage10_mesher.gd'
      - 'tests/world_overhaul_stage10_region_gate_v2.gd'
      - 'tests/world_overhaul_stage10_region_gate_v3.gd'
      - '.github/workflows/world-overhaul-stage10-region-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage10-regions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage10-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/world-overhaul-stage10-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/world-overhaul-stage10-parse.log; then
            exit 1
          fi

      - name: Prepare frozen Stage 10 oracle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tests/world_overhaul_stage10_region_gate_v3.gd').read_text()
          base = Path('tests/world_overhaul_stage10_region_gate_v2.gd').read_text()
          base = base.replace(
              'res://scripts/world/playable_world_generation_runtime.gd',
              'res://scripts/world/playable_world_stage10_generation_runtime.gd',
          )
          Path('tests/.world_overhaul_stage10_region_gate_v2.gd').write_text(base)
          src = src.replace(
              'res://tests/world_overhaul_stage10_region_gate_v2.gd',
              'res://tests/.world_overhaul_stage10_region_gate_v2.gd',
          )
          Path('tests/.world_overhaul_stage10_region_gate_v3.gd').write_text(src)
          PY

      - name: Verify region sizing, transition expression, and performance
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage10-regions" \
            timeout 360 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/.world_overhaul_stage10_region_gate_v3.gd \
              2>&1 | tee artifacts/world-overhaul-stage10-regions.log
          grep -Fq 'WORLD_OVERHAUL_STAGE10_PASS' artifacts/world-overhaul-stage10-regions.log
          grep -Fq 'WORLD_OVERHAUL_STAGE10_JSON=' artifacts/world-overhaul-stage10-regions.log

      - name: Upload Stage 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-overhaul-stage10-region-evidence
          path: artifacts/
          if-no-files-found: error
