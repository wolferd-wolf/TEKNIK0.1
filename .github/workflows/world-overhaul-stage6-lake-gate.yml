name: TEKNIK World Overhaul Stage 6 Lake Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/world/playable_world_generation_data.gd"
      - "scripts/world/playable_world_generation_runtime.gd"
      - "scripts/world/playable_world_stage6_generation_data.gd"
      - "scripts/world/playable_world_stage6_optimized_data.gd"
      - "scripts/world/playable_world_stage6_cache_aware_data.gd"
      - "scripts/world/playable_world_stage6_tree_consistent_data.gd"
      - "scripts/world/playable_world_stage6_cache_fast.gd"
      - "scripts/world/playable_world_stage6_mesher.gd"
      - "scripts/world/playable_world_stage5_generation_data.gd"
      - "scripts/world/playable_world_stage5_cache_fast.gd"
      - "scripts/world/playable_world_stage5_frozen_runtime.gd"
      - "scripts/world/playable_world_stage4_generation_data.gd"
      - "scripts/world/localized_water_bodies.gd"
      - "tests/world_overhaul_stage6_lake_gate.gd"
      - "tests/world_overhaul_stage6_tree_water_gate.gd"
      - ".github/workflows/world-overhaul-stage6-lake-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage6-lakes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage6-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/world-overhaul-stage6-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/world-overhaul-stage6-parse.log; then
            exit 1
          fi

      - name: Verify basin enclosure, chunk continuity, local water and performance
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage6-lakes" \
            timeout 300 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/world_overhaul_stage6_lake_gate.gd \
              2>&1 | tee artifacts/world-overhaul-stage6-lakes.log
          grep -Fq 'WORLD_OVERHAUL_STAGE6_PASS' artifacts/world-overhaul-stage6-lakes.log

      - name: Verify water-aware tree origin and mesher consistency
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage6-tree-water" \
            timeout 300 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/world_overhaul_stage6_tree_water_gate.gd \
              2>&1 | tee artifacts/world-overhaul-stage6-tree-water.log
          grep -Fq 'WORLD_OVERHAUL_STAGE6_TREE_WATER_PASS' artifacts/world-overhaul-stage6-tree-water.log

      - name: Upload Stage 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-overhaul-stage6-lake-evidence
          path: artifacts/
          if-no-files-found: error
