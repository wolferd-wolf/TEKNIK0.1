name: TEKNIK World Overhaul Stage 11 Water Biome Gate

on:
  pull_request:
    paths:
      - 'scripts/world/playable_world_generation_data.gd'
      - 'scripts/world/playable_world_generation_runtime.gd'
      - 'scripts/world/playable_world_stage10_generation_runtime.gd'
      - 'scripts/world/playable_world_stage10_generation_cache_fast.gd'
      - 'scripts/world/playable_world_stage10_cache_fast.gd'
      - 'scripts/world/playable_world_stage11_water_biome_data.gd'
      - 'scripts/world/playable_world_stage11_cache_fast.gd'
      - 'scripts/world/playable_world_stage11_mesher.gd'
      - 'tests/world_overhaul_stage11_water_biome_gate.gd'
      - '.github/workflows/world-overhaul-stage11-water-biome-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage11-water-biomes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage11-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/world-overhaul-stage11-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/world-overhaul-stage11-parse.log; then
            exit 1
          fi

      - name: Prepare frozen Stage 11 oracle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tests/world_overhaul_stage11_water_biome_gate.gd').read_text()
          src = src.replace(
              'res://scripts/world/playable_world_generation_runtime.gd',
              'res://scripts/world/playable_world_stage11_generation_runtime.gd',
          )
          Path('tests/.world_overhaul_stage11_frozen_gate.gd').write_text(src)
          PY

      - name: Verify water-aware biome expression and performance
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage11-water-biomes" \
            timeout 360 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/.world_overhaul_stage11_frozen_gate.gd \
              2>&1 | tee artifacts/world-overhaul-stage11-water-biomes.log
          grep -Fq 'WORLD_OVERHAUL_STAGE11_PASS' artifacts/world-overhaul-stage11-water-biomes.log
          grep -Fq 'WORLD_OVERHAUL_STAGE11_JSON=' artifacts/world-overhaul-stage11-water-biomes.log

      - name: Upload Stage 11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-overhaul-stage11-water-biome-evidence
          path: artifacts/
          if-no-files-found: error
