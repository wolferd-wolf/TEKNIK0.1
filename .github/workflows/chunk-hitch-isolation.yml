name: TEKNIK Chunk Hitch Isolation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/chunk-hitch-isolation.yml

permissions:
  contents: read

jobs:
  export-isolation-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove this commit changes CI only
        run: |
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-commit.txt
          git diff --name-only HEAD^ HEAD | tee artifacts/commit-files.txt
          test "$(cat artifacts/commit-files.txt)" = ".github/workflows/chunk-hitch-isolation.yml"
          git diff --exit-code HEAD^ HEAD -- scripts project.godot export_presets.cfg
          printf '%s\n' \
            'Production runtime under test is unchanged from the parent commit.' \
            'All isolation behavior below is patched only in the ephemeral Actions workspace.' \
            > artifacts/isolation-discipline.txt

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential scons git unzip wget

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate one shared debug keystore
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${RUNNER_TEMP}/teknik-hitch-isolation.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}" >> "$GITHUB_ENV"
          bash scripts/android/setup_debug_keystore.sh "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" > artifacts/debug-keystore.log 2>&1
          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

      - name: Install Android toolchain
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK requirements
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Build arm64 native extension once
        run: |
          git clone --depth 1 --branch 4.3 https://github.com/godotengine/godot-cpp.git native/carpathian/godot-cpp
          printf '%s\n' '{"enabled_classes":["RefCounted","OS"]}' > native/carpathian/build_profile.json
          cat > native/carpathian/SConstruct <<'PY'
          #!/usr/bin/env python
          env = SConscript("godot-cpp/SConstruct")
          env.Append(CPPPATH=["src/"])
          sources = Glob("src/*.cpp")
          library = env.SharedLibrary(
              "bin/libteknik_carpathian{}{}".format(env["suffix"], env["SHLIBSUFFIX"]),
              source=sources,
          )
          env.NoCache(library)
          Default(library)
          PY
          scons -C native/carpathian \
            platform=android \
            target=template_debug \
            arch=arm64 \
            android_api_level=24 \
            ndk_version=23.2.8568313 \
            build_profile=build_profile.json \
            ANDROID_HOME="$ANDROID_HOME" \
            -j2
          LIB_PATH="$(find native/carpathian/bin -maxdepth 1 -type f -name '*.so' | head -n 1)"
          test -n "$LIB_PATH"
          LIB_NAME="$(basename "$LIB_PATH")"
          cat > native/carpathian/teknik_carpathian.gdextension <<EOF
          [configuration]
          entry_symbol = "teknik_carpathian_library_init"
          compatibility_minimum = "4.3"

          [libraries]
          android.debug.arm64 = "res://native/carpathian/bin/$LIB_NAME"
          EOF
          rm -rf native/carpathian/godot-cpp

      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpack
          cp -a /tmp/godot-template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          /tmp/godot/godot --version | tee artifacts/godot-version.txt

      - name: Save pristine runtime files for workspace-only variants
        run: |
          cp scripts/debug/diagnostic_log_capture.gd /tmp/diagnostic_log_capture.base.gd
          cp scripts/world/playable_world_generation_runtime.gd /tmp/playable_world_generation_runtime.base.gd
          cp export_presets.cfg /tmp/export_presets.base.cfg
          grep -Fq 'renderer/rendering_method="gl_compatibility"' project.godot
          grep -Fq 'renderer/rendering_method.mobile="gl_compatibility"' project.godot
          printf '%s\n' \
            'A: no diagnostic disk writer; move normally through fresh chunks.' \
            'B: same no-disk runtime; stand completely still after initial loading settles.' \
            'C: no diagnostic disk writer; after the initial 7x7 render window is fully idle, center changes are ignored so movement cannot start new chunk generation.' \
            > artifacts/test-matrix.txt

      - name: Export A - no diagnostic disk writer, normal movement
        run: |
          cp /tmp/diagnostic_log_capture.base.gd scripts/debug/diagnostic_log_capture.gd
          cp /tmp/playable_world_generation_runtime.base.gd scripts/world/playable_world_generation_runtime.gd
          cp /tmp/export_presets.base.cfg export_presets.cfg
          python3 - <<'PY'
          from pathlib import Path

          mode = 'A_NO_DIAGNOSTIC_DISK_NORMAL_MOVEMENT'
          diag = Path('scripts/debug/diagnostic_log_capture.gd')
          text = diag.read_text()
          text = text.replace(
              'class_name DiagnosticLogCaptureService\n',
              'class_name DiagnosticLogCaptureService\n\nconst HITCH_ISOLATION_MODE := "%s"\n' % mode,
              1,
          )
          text = text.replace(
              'func _ready() -> void:\n\tprocess_mode = Node.PROCESS_MODE_ALWAYS\n',
              'func _ready() -> void:\n\tprocess_mode = Node.PROCESS_MODE_ALWAYS\n\t_append_raw("=== HITCH ISOLATION MODE: %s ===\\n" % HITCH_ISOLATION_MODE)\n',
              1,
          )
          old_flush = '''func _flush_snapshot() -> void:\n\t_buffer_mutex.lock()\n\tif not _dirty:\n\t\t_buffer_mutex.unlock()\n\t\treturn\n\tvar snapshot := _buffer\n\t_dirty = false\n\t_buffer_mutex.unlock()\n\t_write_text(LATEST_LOG_PATH, snapshot)\n'''
          new_flush = '''func _flush_snapshot() -> void:\n\t# HITCH ISOLATION ONLY: retain the in-memory buffer but perform no snapshot write or full-buffer copy.\n\treturn\n'''
          old_write = '''func _write_text(path: String, text: String) -> void:\n\tvar file := FileAccess.open(path, FileAccess.WRITE)\n\tif file == null:\n\t\treturn\n\tfile.store_string(text)\n\tfile.flush()\n'''
          new_write = '''func _write_text(_path: String, _text: String) -> void:\n\t# HITCH ISOLATION ONLY: all DiagnosticLogCapture disk writes are disabled.\n\treturn\n'''
          if old_flush not in text or old_write not in text:
              raise SystemExit('diagnostic writer patch anchors not found')
          text = text.replace(old_flush, new_flush, 1).replace(old_write, new_write, 1)
          diag.write_text(text)

          preset = Path('export_presets.cfg')
          ptext = preset.read_text()
          ptext = ptext.replace('package/unique_name="com.wolferdwolf.teknik"', 'package/unique_name="com.wolferdwolf.teknik.hitchisolation"')
          ptext = ptext.replace('package/name="TEKNIK 0.1"', 'package/name="TEKNIK Hitch A"')
          preset.write_text(ptext)
          PY
          grep -Fq 'A_NO_DIAGNOSTIC_DISK_NORMAL_MOVEMENT' scripts/debug/diagnostic_log_capture.gd
          grep -Fq 'HITCH ISOLATION ONLY: all DiagnosticLogCapture disk writes are disabled.' scripts/debug/diagnostic_log_capture.gd
          grep -Fq 'package/unique_name="com.wolferdwolf.teknik.hitchisolation"' export_presets.cfg
          cp scripts/debug/diagnostic_log_capture.gd artifacts/variant-a-diagnostic-log-capture.gd
          /tmp/godot/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --install-android-build-template \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/artifacts/TEKNIK-Hitch-A-NoDiagDisk-Move.apk" \
            2>&1 | tee artifacts/export-a.log
          test -s artifacts/TEKNIK-Hitch-A-NoDiagDisk-Move.apk

      - name: Export B - no diagnostic disk writer, stand still
        run: |
          cp /tmp/diagnostic_log_capture.base.gd scripts/debug/diagnostic_log_capture.gd
          cp /tmp/playable_world_generation_runtime.base.gd scripts/world/playable_world_generation_runtime.gd
          cp /tmp/export_presets.base.cfg export_presets.cfg
          python3 - <<'PY'
          from pathlib import Path

          mode = 'B_NO_DIAGNOSTIC_DISK_STAND_STILL'
          diag = Path('scripts/debug/diagnostic_log_capture.gd')
          text = diag.read_text()
          text = text.replace(
              'class_name DiagnosticLogCaptureService\n',
              'class_name DiagnosticLogCaptureService\n\nconst HITCH_ISOLATION_MODE := "%s"\n' % mode,
              1,
          )
          text = text.replace(
              'func _ready() -> void:\n\tprocess_mode = Node.PROCESS_MODE_ALWAYS\n',
              'func _ready() -> void:\n\tprocess_mode = Node.PROCESS_MODE_ALWAYS\n\t_append_raw("=== HITCH ISOLATION MODE: %s ===\\n" % HITCH_ISOLATION_MODE)\n',
              1,
          )
          old_flush = '''func _flush_snapshot() -> void:\n\t_buffer_mutex.lock()\n\tif not _dirty:\n\t\t_buffer_mutex.unlock()\n\t\treturn\n\tvar snapshot := _buffer\n\t_dirty = false\n\t_buffer_mutex.unlock()\n\t_write_text(LATEST_LOG_PATH, snapshot)\n'''
          new_flush = '''func _flush_snapshot() -> void:\n\t# HITCH ISOLATION ONLY: retain the in-memory buffer but perform no snapshot write or full-buffer copy.\n\treturn\n'''
          old_write = '''func _write_text(path: String, text: String) -> void:\n\tvar file := FileAccess.open(path, FileAccess.WRITE)\n\tif file == null:\n\t\treturn\n\tfile.store_string(text)\n\tfile.flush()\n'''
          new_write = '''func _write_text(_path: String, _text: String) -> void:\n\t# HITCH ISOLATION ONLY: all DiagnosticLogCapture disk writes are disabled.\n\treturn\n'''
          if old_flush not in text or old_write not in text:
              raise SystemExit('diagnostic writer patch anchors not found')
          text = text.replace(old_flush, new_flush, 1).replace(old_write, new_write, 1)
          diag.write_text(text)

          preset = Path('export_presets.cfg')
          ptext = preset.read_text()
          ptext = ptext.replace('package/unique_name="com.wolferdwolf.teknik"', 'package/unique_name="com.wolferdwolf.teknik.hitchisolation"')
          ptext = ptext.replace('package/name="TEKNIK 0.1"', 'package/name="TEKNIK Hitch B"')
          preset.write_text(ptext)
          PY
          grep -Fq 'B_NO_DIAGNOSTIC_DISK_STAND_STILL' scripts/debug/diagnostic_log_capture.gd
          cp scripts/debug/diagnostic_log_capture.gd artifacts/variant-b-diagnostic-log-capture.gd
          /tmp/godot/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/artifacts/TEKNIK-Hitch-B-NoDiagDisk-Still.apk" \
            2>&1 | tee artifacts/export-b.log
          test -s artifacts/TEKNIK-Hitch-B-NoDiagDisk-Still.apk

      - name: Export C - no diagnostic disk writer, prevent new generation after initial window
        run: |
          cp /tmp/diagnostic_log_capture.base.gd scripts/debug/diagnostic_log_capture.gd
          cp /tmp/playable_world_generation_runtime.base.gd scripts/world/playable_world_generation_runtime.gd
          cp /tmp/export_presets.base.cfg export_presets.cfg
          python3 - <<'PY'
          from pathlib import Path

          mode = 'C_NO_DIAGNOSTIC_DISK_GENERATION_PREVENTED'
          diag = Path('scripts/debug/diagnostic_log_capture.gd')
          text = diag.read_text()
          text = text.replace(
              'class_name DiagnosticLogCaptureService\n',
              'class_name DiagnosticLogCaptureService\n\nconst HITCH_ISOLATION_MODE := "%s"\n' % mode,
              1,
          )
          text = text.replace(
              'func _ready() -> void:\n\tprocess_mode = Node.PROCESS_MODE_ALWAYS\n',
              'func _ready() -> void:\n\tprocess_mode = Node.PROCESS_MODE_ALWAYS\n\t_append_raw("=== HITCH ISOLATION MODE: %s ===\\n" % HITCH_ISOLATION_MODE)\n',
              1,
          )
          old_flush = '''func _flush_snapshot() -> void:\n\t_buffer_mutex.lock()\n\tif not _dirty:\n\t\t_buffer_mutex.unlock()\n\t\treturn\n\tvar snapshot := _buffer\n\t_dirty = false\n\t_buffer_mutex.unlock()\n\t_write_text(LATEST_LOG_PATH, snapshot)\n'''
          new_flush = '''func _flush_snapshot() -> void:\n\t# HITCH ISOLATION ONLY: retain the in-memory buffer but perform no snapshot write or full-buffer copy.\n\treturn\n'''
          old_write = '''func _write_text(path: String, text: String) -> void:\n\tvar file := FileAccess.open(path, FileAccess.WRITE)\n\tif file == null:\n\t\treturn\n\tfile.store_string(text)\n\tfile.flush()\n'''
          new_write = '''func _write_text(_path: String, _text: String) -> void:\n\t# HITCH ISOLATION ONLY: all DiagnosticLogCapture disk writes are disabled.\n\treturn\n'''
          if old_flush not in text or old_write not in text:
              raise SystemExit('diagnostic writer patch anchors not found')
          text = text.replace(old_flush, new_flush, 1).replace(old_write, new_write, 1)
          diag.write_text(text)

          runtime = Path('scripts/world/playable_world_generation_runtime.gd')
          rtext = runtime.read_text()
          old_center = '''func set_center(next_center: Vector2i) -> void:\n\tvar started_usec := Time.get_ticks_usec()\n\tsuper.set_center(next_center)\n\t_last_center_change_usec = Time.get_ticks_usec() - started_usec\n\t_max_center_change_usec = maxi(_max_center_change_usec, _last_center_change_usec)\n'''
          new_center = '''func set_center(next_center: Vector2i) -> void:\n\t# HITCH ISOLATION C ONLY: once the initial 7x7 render window is completely\n\t# built and idle, ignore movement-driven center changes. This leaves the\n\t# already loaded chunks intact while making it impossible for movement to\n\t# enqueue any new chunk generation.\n\tvar full_window_count := (RENDER_RADIUS * 2 + 1) * (RENDER_RADIUS * 2 + 1)\n\tif (\n\t\tloaded.size() >= full_window_count\n\t\tand build_queue.is_empty()\n\t\tand active_build_tasks.is_empty()\n\t\tand build_apply_queue.is_empty()\n\t\tand collision_add_queue.is_empty()\n\t):\n\t\treturn\n\tvar started_usec := Time.get_ticks_usec()\n\tsuper.set_center(next_center)\n\t_last_center_change_usec = Time.get_ticks_usec() - started_usec\n\t_max_center_change_usec = maxi(_max_center_change_usec, _last_center_change_usec)\n'''
          if old_center not in rtext:
              raise SystemExit('generation-prevention patch anchor not found')
          runtime.write_text(rtext.replace(old_center, new_center, 1))

          preset = Path('export_presets.cfg')
          ptext = preset.read_text()
          ptext = ptext.replace('package/unique_name="com.wolferdwolf.teknik"', 'package/unique_name="com.wolferdwolf.teknik.hitchisolation"')
          ptext = ptext.replace('package/name="TEKNIK 0.1"', 'package/name="TEKNIK Hitch C"')
          preset.write_text(ptext)
          PY
          grep -Fq 'C_NO_DIAGNOSTIC_DISK_GENERATION_PREVENTED' scripts/debug/diagnostic_log_capture.gd
          grep -Fq 'HITCH ISOLATION C ONLY' scripts/world/playable_world_generation_runtime.gd
          cp scripts/debug/diagnostic_log_capture.gd artifacts/variant-c-diagnostic-log-capture.gd
          cp scripts/world/playable_world_generation_runtime.gd artifacts/variant-c-generation-runtime.gd
          /tmp/godot/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/artifacts/TEKNIK-Hitch-C-NoDiagDisk-NoGeneration.apk" \
            2>&1 | tee artifacts/export-c.log
          test -s artifacts/TEKNIK-Hitch-C-NoDiagDisk-NoGeneration.apk

      - name: Verify all three isolation APKs
        run: |
          for apk in \
            artifacts/TEKNIK-Hitch-A-NoDiagDisk-Move.apk \
            artifacts/TEKNIK-Hitch-B-NoDiagDisk-Still.apk \
            artifacts/TEKNIK-Hitch-C-NoDiagDisk-NoGeneration.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | sed -n '1,8p'
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.wolferdwolf.teknik.hitchisolation'"
            unzip -Z1 "$apk" | grep -F 'libteknik_carpathian' >/dev/null
            sha256sum "$apk"
          done | tee artifacts/apk-verification.txt

      - name: Upload three-way hitch isolation evidence
        uses: actions/upload-artifact@v4
        with:
          name: teknik-chunk-hitch-isolation
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
