name: TEKNIK World Overhaul Stage 1 Historical Gate

# Stage 1 required assertion-equivalence with the legacy terrain. Stage 2
# intentionally replaces terrain shape, so this gate is retained as a manual
# historical check rather than an automatic PR requirement.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-equivalence-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage1-parse" \
            timeout 120 /tmp/godot/godot --headless --path . --editor --quit \
            2>&1 | tee artifacts/world-overhaul-stage1-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/world-overhaul-stage1-parse.log; then
            exit 1
          fi

      - name: Run historical Stage 1 equivalence test
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/teknik-stage1-gate" \
            timeout 300 /tmp/godot/godot --headless --audio-driver Dummy --path . \
              --script res://tests/world_overhaul_stage1_gate.gd \
              2>&1 | tee artifacts/world-overhaul-stage1-gate.log

      - name: Upload historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-overhaul-stage1-historical-evidence
          path: artifacts/
          if-no-files-found: error
