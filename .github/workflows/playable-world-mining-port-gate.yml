name: TEKNIK Single World Gameplay Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-world-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-world-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse single-world project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee artifacts/single-world-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/single-world-parse.log; then
            exit 1
          fi

      - name: Validate world, edits, streaming, collision, and inventory contract
        run: |
          set -o pipefail
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/godot \
            --audio-driver Dummy \
            --path . \
            --script res://tests/single_world_gameplay_gate.gd \
            2>&1 | tee artifacts/single-world-gameplay.log
          grep -F "SINGLE_WORLD_GAMEPLAY_GATE_PASS" artifacts/single-world-gameplay.log

      - name: Reject retired desktop-world references
        run: |
          set -o pipefail
          if grep -R -n -E 'res://scripts/world/(chunk|chunk_manager|chunk_mesher|threaded_chunk_mesher)\.gd' \
            --include='*.gd' --include='*.tscn' --include='*.yml' .; then
            echo "Retired desktop-world reference found"
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-world-gameplay-evidence
          path: artifacts/
          if-no-files-found: error
