name: TEKNIK Playable World Standalone Gate

on:
  pull_request:
    paths:
      - 'scripts/world/**'
      - 'scripts/inventory/**'
      - 'native/carpathian/**'
      - 'tests/playable_world_mining_port_gate.gd'
      - '.github/workflows/playable-world-mining-port-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playable-world-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playable-world-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Parse standalone project strictly
        run: |
          mkdir -p artifacts
          set -o pipefail
          timeout 120 /tmp/godot/godot --headless --path . --editor --quit 2>&1 | tee artifacts/playable-world-standalone-parse.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' artifacts/playable-world-standalone-parse.log; then
            exit 1
          fi

      - name: Prove playable world runs without legacy inheritance or fallback
        run: |
          set -o pipefail
          timeout 300 /tmp/godot/godot \
            --headless \
            --audio-driver Dummy \
            --path . \
            --script res://tests/playable_world_mining_port_gate.gd \
            2>&1 | tee artifacts/playable-world-standalone.log
          grep -F "PLAYABLE_WORLD_STANDALONE_GATE_PASS" artifacts/playable-world-standalone.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-world-standalone-evidence
          path: artifacts/
          if-no-files-found: error
